<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow study column; a tab rail on top, the sentence card as the stage, word bank below as a ledger. */
:root{
  /* 純黑背景（深色單一主題）：卡片用極深灰浮在黑底上，文字用暖白，強調色調亮以免在黑底上發暗 */
  --bg:#000000; --surface:#111113; --ink:#ecebe7; --muted:#8d8d93; --line:#26262b;
  --ai:#9ab7ec; --ai-soft:#151f33; --ok:#7fd3a0; --ok-soft:#0f2419; --ng:#ff8e78; --ng-soft:#2b130e; --hint:#e8c46e; --hint-soft:#29200d;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans TC","Microsoft JhengHei","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ai);border-bottom-color:var(--ai);font-weight:700}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ng-soft);color:var(--ng);font-size:11px;margin-left:4px;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;gap:8px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.ng{background:var(--ng)} .dots i.cur{background:var(--ai)}
.pos{display:inline-block;font-size:12px;color:var(--ai);background:var(--ai-soft);padding:1px 8px;border-radius:4px}
.sentence{font-family:var(--f-display);font-size:24px;line-height:2.2;font-weight:500;word-break:break-word}
.sentence rt{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.blank-in{font:inherit;font-family:var(--f-body);font-size:21px;border:0;border-bottom:2px solid var(--ai);background:var(--ai-soft);color:var(--ink);padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;text-align:center;max-width:100%}
.blank-in.shake{animation:shake .3s}
.blank-box{display:inline-block;min-width:3em;border-bottom:2px solid var(--ai);margin:0 3px;text-align:center;color:var(--ai)}
.filled{color:var(--ai);font-weight:700}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.blank-in.shake{animation:none}}
.tr{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:700}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.msg{padding:10px 14px;border-radius:8px;font-size:14px}
.msg.ng{background:var(--ng-soft);color:var(--ng)}
.msg.hint{background:var(--hint-soft);color:var(--hint)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.detail{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:4px}
.detail .w{font-family:var(--f-display);font-size:22px;font-weight:700}
.detail .k{color:var(--muted);margin-left:8px;font-size:15px;font-family:var(--f-body);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.choices{grid-template-columns:1fr}}
.choice{font-family:var(--f-display);font-size:19px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;text-align:center;letter-spacing:.06em;line-height:1.3}
.center{text-align:center}
.kana-in{font:inherit;font-size:22px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:min(320px,100%);margin:0 auto;display:block}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative}
.starbtn{position:absolute;right:6px;bottom:6px;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:50%;padding:0;z-index:2;transition:color .15s,transform .15s}
.starbtn svg{fill:none}
.starbtn:hover{color:var(--ai)}
.starbtn.on{color:#e0a526}
.starbtn.on svg{fill:currentColor}
.starbtn:active{transform:scale(.85)}
.flash .starbtn{right:-6px;bottom:-8px}
.flash.swipe{background:var(--surface);padding:10px 8px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;border-radius:14px;will-change:transform}
.flash.swipe.sw-ok{box-shadow:inset 0 0 0 2px #6b9e6b}
.flash.swipe.sw-ng{box-shadow:inset 0 0 0 2px #c0645a}
.swl{position:absolute;top:4px;padding:3px 10px;border-radius:8px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;border:2px solid}
.swl.ok{left:4px;color:#5a8f5a;transform:rotate(-10deg)}
.swl.ng{right:4px;color:#b8564c;transform:rotate(10deg)}
.fcm{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px));gap:10px}
body.fcm-on{overflow:hidden}
.fcm-top{display:grid;grid-template-columns:40px 1fr 56px;align-items:center;min-height:40px}
.fcm-top b{text-align:center;font-size:16px;color:var(--ink)}
.fcm-top span{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fcm-x{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:30px;line-height:1;cursor:pointer;padding:0 0 4px;border-radius:50%}
.fcm-bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.fcm-bar i{display:block;height:100%;background:var(--ai);border-radius:5px;transition:width .3s}
.fcm-sub{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);min-height:22px}
.fcm-lv{background:var(--ai);color:var(--bg);font-weight:700;font-size:11px;padding:2px 9px;border-radius:999px}
.fcm-stage{flex:1;min-height:0;display:flex}
.fcm-card.flash{flex:1;min-height:0;justify-content:flex-start;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 24px color-mix(in srgb, var(--ink) 8%, transparent)}
.fcm-tools{position:absolute;top:10px;right:10px;z-index:3}
.fcm-tools .starbtn{position:static}
.fcm-front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px 0}
.fcm-big{font-size:clamp(40px, 14vw, 60px);font-weight:700;letter-spacing:.04em;color:var(--ink);line-height:1.3;word-break:break-all}
.fcm-big.furi rt{font-size:.3em;font-weight:500;color:var(--muted)}
.fcm-tap{text-align:center;font-size:12px;color:var(--muted)}
.fcm-back{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.fcm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:34px}
.fcm-w{font-size:clamp(34px, 11vw, 46px);font-weight:700;color:var(--ink);line-height:1.2;word-break:break-all}
.fcm-k{font-size:17px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
.fcm-head .spk{width:44px;height:44px;border-radius:50%;background:var(--ai);color:var(--bg);flex:none}
.fcm-mean{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:17px;color:var(--ink);padding-bottom:14px;border-bottom:1px solid var(--line)}
.fcm-sec{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fcm-sec:last-of-type{border-bottom:0}
.fcm-lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fcm-lab .spk{width:26px;height:26px}
.fcm-sec .sentence{font-size:18px;line-height:1.9}
.fcm-det{align-self:flex-start;font-size:13px;padding:6px 0;min-height:0}
.fcm-hint{text-align:center;font-size:11px;color:var(--muted)}
.fcm-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcm-foot .btn{min-height:52px;border-radius:999px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;margin:0}
.fcm-no{background:var(--surface)}
.rhead{display:flex;align-items:baseline;gap:8px;margin-bottom:-4px}
.rhead b{font-size:15px}
.rhead small{color:var(--muted);font-size:13px}
.swhint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.det-card .starbtn{right:12px;bottom:12px}
.cardopts{display:flex;gap:6px;justify-content:flex-end;margin-top:-4px}
.optchip{font:inherit;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.optchip:disabled{opacity:.35;cursor:default}
.optchip[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.big.furi{line-height:1.9}
.big ruby rt{font-size:.36em;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.pager span{color:var(--muted);font-size:14px;min-width:56px;text-align:center}
.pager .btn:disabled{opacity:.35}
#bankGrid{touch-action:pan-y}
.wgrid.slidel{animation:slidel .22s ease}.wgrid.slider{animation:slider .22s ease}
@keyframes slidel{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slider{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.summary li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.summary ul{list-style:none;margin:0;padding:0}
.summary .mark{width:20px;font-weight:700}
.summary .mark.ok{color:var(--ok)} .summary .mark.ng{color:var(--ng)}
.score{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.add .full{grid-column:1/-1}
@media (max-width:520px){form.add{grid-template-columns:1fr}}
form.add label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
form.add input,form.add select{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;perspective:900px}
@media (max-width:420px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wc{display:grid;cursor:pointer;min-width:0;border-radius:10px}
.wc .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .4s ease;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;min-height:110px;min-width:0;position:relative}
.wc .front{display:flex;align-items:center;justify-content:center;text-align:center}
.wc .back{transform:rotateY(180deg);display:flex;flex-direction:column;gap:3px;background:var(--surface);border-color:var(--ai)}
.wc.open .front{transform:rotateY(-180deg)}
.wc.open .back{transform:rotateY(0)}
.wc:hover .face{border-color:var(--ai)}
.wc:not(.open) .back,.wc.open .front{pointer-events:none}
.wc:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.wc .face{transition:none}}
.wc .fw{font-family:var(--f-display);font-size:22px;font-weight:700;word-break:break-word}
.wc .fw{line-height:1.8}
.wc .fw ruby rt{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0}
.wc .fwrap{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.wgrid.long .fwrap{align-items:flex-start}
.wc .falt{font-family:var(--f-display);font-size:13px;color:var(--muted);line-height:1.4;min-height:1.4em;word-break:break-word}
.wc .falt i{font-style:normal;opacity:.5;margin:0 2px}
.wc .falt b{font-weight:500;white-space:nowrap}
.wc .lvc{position:absolute;top:6px;right:8px;font-size:10px;color:var(--muted);letter-spacing:.04em}
.wc .bw{font-family:var(--f-display);font-size:17px;font-weight:700;padding-right:40px;word-break:break-word}
.wc .bk{color:var(--muted);font-size:13px;padding-right:40px}
.wc .bm{font-size:13px;line-height:1.45}
.wc .bs{margin-top:auto;padding-top:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wc .bs b.ok{color:var(--ok)} .wc .bs b.ng{color:var(--ng)}
.delbtn{font:inherit;font-size:11px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px}
.delbtn:hover{color:var(--ng)}
.switch{font:inherit;font-size:13px;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);cursor:pointer;padding:4px 0}
.switch .knob{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--ai)}
.switch[aria-checked="true"] .knob::after{transform:translateX(14px)}
.conjbtn{position:absolute;top:24px;right:6px;font:inherit;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--ai);background:none;color:var(--ai);cursor:pointer}
.conjbtn:hover{background:var(--ai-soft)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--ink) 40%, transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px 18px 22px;width:min(480px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.sheet .w2{font-family:var(--f-display);font-size:22px;font-weight:700}
.sheet h3{font-size:13px;color:var(--ai);margin:8px 0 0}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;width:100%;font-size:14px}
.ctab th{text-align:left;font-weight:500;color:var(--muted);padding:6px 10px 6px 0;white-space:nowrap;font-size:12px}
.ctab td{padding:6px 10px 6px 0;border-top:1px solid var(--line)}
.ctab th{border-top:1px solid var(--line)}
.ctab .cw{font-family:var(--f-display);font-size:17px;font-weight:700}
.ctab .ck{color:var(--muted);font-size:13px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:4px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ai);cursor:pointer;vertical-align:middle;padding:0}
.spk:hover{border-color:var(--ai);background:var(--ai-soft)}
.wc .spk{width:24px;height:24px}
.sayline{display:flex;align-items:center;gap:6px}
.sayline .spk{margin-left:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:4px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface);font-weight:700}
.conn{font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.conn span{font-size:11px;color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:0 5px}
.note{font-size:13px;color:var(--hint);background:var(--hint-soft);padding:6px 10px;border-radius:6px}
.bconn{font-size:12px;color:var(--ink)}
.wgrid.long{grid-template-columns:1fr}
.wgrid.long .face{min-height:60px;padding:10px 80px 10px 16px}
.wgrid.long .front .detbtn{top:50%;right:10px;transform:translateY(-50%);margin-top:4px}
.wgrid.long .front .cstar{top:50%;bottom:auto;right:38px;transform:translateY(-50%);margin-top:4px}
.wgrid.long .front .cstar:active{transform:translateY(-50%) scale(.85)}
.wgrid.long .front{justify-content:flex-start;text-align:left}
.wgrid.long .fw{font-size:20px}
.wgrid.gram .wc{container-type:inline-size}
.wgrid.gram .fw{font-size:clamp(15px, calc((100cqw - 48px) * var(--gk, 1.7) / var(--gn, 8)), 21px);line-height:1.5;text-wrap:balance;line-break:strict}
.wgrid.gram .front .fwrap{padding:0 4px}
.wgrid.gram .bw{font-size:15px}
.wgrid.gram .bw .spk{position:absolute;top:22px;right:6px;z-index:2}
.wgrid.gram .back .detbtn{top:auto;bottom:11px;right:42px}
.wgrid.gram{grid-template-columns:repeat(2,minmax(0,1fr))}
.wgrid.gram .bm{font-size:16px;font-weight:700;color:var(--ai);line-height:1.5;margin-top:2px}
.wgrid.long .back{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 16px}
.wgrid.long .bw{padding-right:0;font-size:18px}
.wgrid.long .bk{padding-right:0}
.wgrid.long .bm{flex:1 1 180px;font-size:14px}

.det-lv{justify-self:center;font-size:15px;font-weight:700;color:var(--ng);background:var(--ng-soft);border-radius:16px;padding:4px 16px}
.det-pos{justify-self:end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.det-card{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:48px 44px 36px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.det-say{position:absolute;top:14px;right:14px}
.det-nav{position:absolute;top:50%;transform:translateY(-50%);font:inherit;font-size:30px;background:none;border:0;color:var(--muted);cursor:pointer;width:36px;height:56px}
.det-nav.prev{left:4px}.det-nav.next{right:4px}
.det-w{font-family:var(--f-display);font-size:clamp(30px,9vw,46px);font-weight:700;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.det-conn{font-size:14px;color:var(--muted)}
.det-rule{width:44px;height:2px;background:var(--ng);border-radius:1px;margin:8px 0}
.det-m{font-size:22px;font-weight:700}
.det-note{font-size:14px;color:var(--muted);max-width:28em}
.det-groups{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.det-chip{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 12px;display:flex;gap:6px;align-items:baseline;color:var(--muted)}
.det-chip b{color:var(--ai);font-family:var(--f-display)}
.det-sec{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;letter-spacing:.1em}
.det-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.det-exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dex{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.dexs{flex:1;min-width:0}
.dexj{font-family:var(--f-display);font-size:19px;line-height:1.7}
.dexj em{font-style:normal;color:var(--ng);font-weight:700}
.dext{font-size:14px;color:var(--muted);margin-top:2px}
.gw{display:inline-block;line-height:1.75}
.choices.zh .choice{font-family:var(--f-body);font-size:16px}
.choices.cq .choice{font-family:var(--f-body);font-size:16px}
.connq{font-family:var(--f-display);font-size:clamp(22px,6.5vw,32px);font-weight:700;padding:12px 0}
.connq .blank-box{min-width:3.2em}
.big.gtitle{font-size:clamp(30px,9vw,44px)}
.cxlv{display:flex;justify-content:flex-end;margin-top:-6px}
.cxlv .seg button{padding:4px 14px}
.cxq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 0;font-family:var(--f-display);font-size:clamp(22px,6.5vw,30px);font-weight:700}
.cxslot{font:inherit;font-family:var(--f-body);font-size:14px;font-weight:500;min-width:84px;min-height:52px;padding:6px 10px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;max-width:100%}
.cxslot.on{border-color:var(--ai);border-style:solid;background:var(--ai-soft)}
.cxslot:disabled{cursor:default}
.cxq-mark{font-size:22px;color:var(--muted)}
.cxchip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.cxchip.bad{border-color:var(--ng);color:var(--ng);background:var(--ng-soft)}
.cxchip.hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cxhint{text-align:center;font-size:13px;color:var(--muted)}
.cxhint b{color:var(--ai)}
.cxpanel{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.cxwhere{font-size:12px;color:var(--muted)}
.cxcats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cxcats button{font:inherit;font-size:13px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative;white-space:nowrap}
.cxcats button[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--bg);font-weight:700}
.cxcats button i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ng)}
.cxforms{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.cxforms button{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cxforms button b{font-size:14px;font-weight:600}
.cxforms button small{font-size:11px;color:var(--muted);font-family:var(--f-display)}
.cxforms button[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft);box-shadow:inset 0 0 0 1px var(--ai)}
.cxforms button[aria-pressed="true"] b{color:var(--ai)}
.cxans{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cxans-h{width:100%;font-size:12px;color:var(--muted);margin-top:4px}

.fcm-big.gram{font-size:clamp(28px,9vw,44px);word-break:normal;line-break:strict}
.fcm-w:has(.gw){font-size:clamp(26px,8vw,36px);word-break:normal}
:root .big:has(.gw){font-size:36px}
.gw rt{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0}
/* 色調：黑（預設）／深藍／淺色，切換按鈕在語言旁邊 */
:root[data-tone="navy"]{
  --bg:#121821; --surface:#1a222e; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2e3948;
  --ai:#8fb0e3; --ai-soft:#22314a; --ok:#7cc79a; --ok-soft:#1d3327; --ng:#ee8f7a; --ng-soft:#3a231e; --hint:#e3bf6a; --hint-soft:#3a3020; color-scheme:dark}
:root[data-tone="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1c2533; --muted:#5d6878; --line:#d9dee7;
  --ai:#27497a; --ai-soft:#e3eaf5; --ok:#2f7a4f; --ok-soft:#e2f2e8; --ng:#b2452f; --ng-soft:#f8e5e0; --hint:#8a6413; --hint-soft:#f7efd9; color-scheme:light}
:root[data-tone="milk"]{
  --bg:#e6d6c8; --surface:#f4ebe2; --ink:#3b2b20; --muted:#7a6352; --line:#d3c0ae;
  --ai:#8a5a3b; --ai-soft:#ead9c8; --ok:#4f7a45; --ok-soft:#e1e8d4; --ng:#a8483a; --ng-soft:#f1d9cf; --hint:#8a6420; --hint-soft:#efe0c4; color-scheme:light}
:root[data-tone="milk"] .seg button[aria-pressed="true"],:root[data-tone="milk"] .btn.primary{color:#fff8f0}
/* 純黑主題微調 */
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) .wc .face{background:#08080a}
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) .wc .back{background:var(--surface)}
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) :is(.searchbox,.filterbtn){background:#08080a}
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) .btn.primary{color:#0b0b0d}
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) .seg button[aria-pressed="true"]{color:#0b0b0d}
:root:not([data-tone="navy"]):not([data-tone="light"]):not([data-tone="milk"]) .toast{background:#1d1d21;color:var(--ink);border:1px solid var(--line)}
:root[data-tone="navy"] .seg button[aria-pressed="true"],:root[data-tone="navy"] .btn.primary{color:#0d1420}
.toprow{display:flex;gap:6px;align-items:center}
.tonebtn{font:inherit;font-size:12px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tonebtn:hover{border-color:var(--ai);color:var(--ink)}
.tonebtn i{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);display:inline-block}

/* 首頁 */
h1{cursor:pointer}
.hdoms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hdom{font:inherit;text-align:left;padding:12px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.hdom b{font-size:15px;white-space:nowrap}
.hdom small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdom[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.hdom[aria-pressed="true"] b{color:var(--ai)}
.hdom:disabled{opacity:.45;cursor:default}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hstat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:10px;background:var(--bg)}
.hstat b{font-family:var(--f-display);font-size:26px;line-height:1.1;color:var(--ink)}
.hstat span{font-size:12px;color:var(--muted);white-space:nowrap}
.hstat.warn b{color:var(--ng)}
.hstat b small{font-size:.55em;color:var(--muted);font-weight:500}
.hstat.good b{color:var(--pk-ok,var(--ai))}
.hbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.hlvd summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);padding:2px 0}
.hlvd summary::-webkit-details-marker{display:none}
.hlvd summary::after{content:"▾";transition:transform .2s}
.hlvd[open] summary::after{transform:rotate(180deg)}
.hlvd[open] summary{margin-bottom:10px}
.hlv{display:flex;flex-direction:column;gap:6px}
.hlvrow{font:inherit;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:4px 2px;border:0;background:none;color:var(--ink);cursor:pointer;text-align:left;border-radius:6px}
.hlvrow:hover .hlvbar{background:color-mix(in srgb, var(--line) 70%, var(--ai))}
.hlvn{font-size:13px;font-weight:700;color:var(--muted)}
.hlvbar{display:flex;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hlvbar i{display:block;height:100%}
.hlvbar i.ok{background:var(--pk-ok)}
.hlvbar i.ng{background:var(--pk-ng)}
.hlvc .okt{color:var(--pk-ok);font-weight:700}
.hlvc .ngt{color:var(--pk-ng);font-weight:700}
.hlvc{font-size:13px;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.hlvc small{color:var(--muted)}
.tdl{display:flex;flex-direction:column;gap:8px}
.td{font:inherit;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .1s}
.td:hover{border-color:var(--ai)}
.td:active{transform:scale(.99)}
.tdck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--ai);color:var(--ai)}
.tdtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tdtx b{font-size:16px}
.tdtx small{font-size:12px;color:var(--muted)}
.tdbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px;max-width:160px}
.tdbar i{display:block;height:100%;background:var(--ai)}
.tdgo{font-size:20px;color:var(--muted)}
.td.done{opacity:.6}
.td.done .tdck{background:var(--ai);color:var(--surface)}
.td.done b{text-decoration:line-through;text-decoration-thickness:1px}
.td.off .tdck{border-color:var(--line);color:var(--muted)}
.td.warn .tdck{border-color:var(--ng);color:var(--ng)}
.hfeats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hfeat{font:inherit;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px;transition:border-color .15s,transform .1s}
.hfeat:hover{border-color:var(--ai)}
.hfeat:active{transform:scale(.98)}
.hfeat .hico{font-size:20px;color:var(--ai);line-height:1}
.hfeat b{font-size:18px;margin-top:auto}
.hfeat small{font-size:12px;color:var(--muted)}
.hk-main{display:flex;gap:16px;align-items:center}
.hk-big{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;color:var(--ai);min-width:72px;text-align:center}
.hk-m{font-size:18px;font-weight:700}
.hk-words{display:flex;flex-wrap:wrap;gap:8px}
.hk-w{font:inherit;display:flex;flex-direction:column;align-items:flex-start;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hk-w span{font-family:var(--f-display);font-size:17px;line-height:1.8}
.hk-w span rt{font-size:.5em;color:var(--muted)}
.hk-w small{font-size:11px;color:var(--muted);max-width:10em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.hgrid{grid-template-columns:repeat(2,1fr)}}

/* 使用說明 */
.hguide{font:inherit;font-size:14px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-radius:12px;border:1px dashed var(--ai);background:var(--ai-soft);color:var(--ai);cursor:pointer}
.hguide span{width:22px;height:22px;border-radius:50%;background:var(--ai);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.hguide b{margin-left:auto}
.guide .gsec{gap:10px;padding:16px 18px}
.guide .gsec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.guide .gsec summary::-webkit-details-marker{display:none}
.guide .gsec summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.guide .gsec[open] summary::after{transform:rotate(180deg)}
.gbody{font-size:15px;line-height:1.75}
.gbody ul,.gbody ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.gbody p{margin:10px 0 0;color:var(--muted);font-size:14px}
.gbody b{color:var(--ai)}

/* 漢字 */
.kjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kj{font:inherit;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.kj:hover{border-color:var(--ai)}
.kjc{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.kjr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kj small{position:absolute;top:3px;right:6px;font-size:10px;color:var(--muted)}
.kjcard{gap:12px}
.kjbig{font-family:var(--f-display);font-size:96px;font-weight:700;line-height:1.1;color:var(--ai)}
.kjreads{display:flex;flex-direction:column;gap:8px;align-items:center}
.kjreads>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.kjlab{font-size:12px;color:var(--muted);margin-right:4px}
.kjchip{font:inherit;font-size:15px;padding:3px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kjchip.on{border-color:var(--ai);color:var(--ai)}
.kjchip small{font-size:.8em;color:var(--muted);margin-left:1px}
.kjgrp{display:flex;flex-direction:column;gap:8px}
.kjgh{display:flex;gap:10px;align-items:center}
.kjgh .kjchip{cursor:default}
.kjws{display:flex;flex-direction:column;gap:6px}
.kjw{font:inherit;display:flex;align-items:baseline;gap:12px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kjwr{font-family:var(--f-display);font-size:20px;line-height:2;white-space:nowrap}
.kjwr rt{font-size:.5em;color:var(--muted)}
.kjw small{font-size:13px;color:var(--muted)}
em.kjhit{font-style:normal;color:var(--ng)}
em.kjhit rt{color:var(--ng)}
.hk-w em.kjhit{color:var(--ng)}
.kjref{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.kjref:hover{color:var(--ai);border-color:var(--ai)}
.kjref.spin svg{animation:kjspin .45s ease}
@keyframes kjspin{from{transform:rotate(-360deg)}to{transform:none}}
.rsz{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:13px;color:var(--muted)}
.rsz input{width:56px;font:inherit;font-size:14px;text-align:center;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pbar{flex:1;display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-right:12px}
.pbar i{display:block;height:100%}
.pbar i.ok{background:var(--ok)}
.pbar i.ng{background:var(--ng)}
.rsz{flex-wrap:wrap}
.rsz>span{white-space:nowrap}
.dgbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.dgbar i{display:block;height:100%;background:var(--pk-ok,var(--ai));border-radius:4px}
.dgmini{margin-right:auto;order:-1;color:var(--ai);font-weight:700}
.setbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.setbtn:hover{color:var(--ai);border-color:var(--ai)}
.askgoal .bsheet-body{gap:12px}
.agopt{font:inherit;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.agopt:hover{border-color:var(--ai)}
.agopt b{font-size:16px;color:var(--ai)}
.agopt small{font-size:13px;color:var(--muted)}
.fopts.q4{grid-template-columns:repeat(4,1fr)}
.fopts.q2{grid-template-columns:repeat(2,1fr)}
.fopts.q3{grid-template-columns:repeat(3,1fr)}
.stepper{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.stepper input{width:72px;font:inherit;font-size:16px;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stepper .rsb{width:34px;height:34px}
.rdq{font:inherit;font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.rdq.on{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.rsb{font:inherit;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1}

/* 翻牌選級數 */
.cplegend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.cplegend span{display:flex;align-items:center;gap:5px}
.cplegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
:root{--pk-ok:#9ab7ec;--pk-ng:#e3907e}
:root[data-tone="navy"]{--pk-ok:#8fb0e3;--pk-ng:#df9a88}
:root[data-tone="light"]{--pk-ok:#3a5f94;--pk-ng:#d08a73}
:root[data-tone="milk"]{--pk-ok:#7a4e32;--pk-ng:#cf9474}
.cplegend i.ok,.cpbar i.ok{background:var(--pk-ok)}
.cplegend i.ng,.cpbar i.ng{background:var(--pk-ng)}
.cplegend i.nw{background:var(--line)}
.cplist{display:flex;flex-direction:column;gap:12px}
.cpcard{font:inherit;display:grid;grid-template-columns:1fr 92px;grid-template-areas:"st st" "name go" "bar num";align-items:center;gap:6px 14px;text-align:left;padding:14px 18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .1s,border-color .15s}
.cpcard:hover{border-color:var(--ai)}
.cpcard:active{transform:scale(.99)}
.cpst{grid-area:st;font-size:12px;color:var(--muted)}
.cpst.doing{color:var(--pk-ng)}
.cpst.done{color:var(--pk-ok);font-weight:700}
.cpname{grid-area:name;font-size:22px;font-weight:700}
.cpgo{grid-area:go;font-size:22px;color:var(--muted);justify-self:end}
.cpbar{grid-area:bar;display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.cpbar i{display:block;height:100%}
.cpnum{grid-area:num;justify-self:end;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cpnum .okt{color:var(--pk-ok)} .cpnum .ngt{color:var(--pk-ng)} .cpnum small{color:var(--muted)}
.cpback{justify-content:space-between}
.cplv{font-weight:700;color:var(--ai)}

/* 設定 */
.tonebtn svg{flex:none}
.settings .bsheet-head h2{display:flex;align-items:center;gap:8px}
.settings .bsheet-head h2 svg{color:var(--ai)}
.settabs{display:flex;gap:4px;padding:0 20px 8px;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 -1px 0 var(--line)}
.settabs::-webkit-scrollbar{display:none}
.settabs button{font:inherit;font-size:14px;white-space:nowrap;padding:6px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}
.settabs button[aria-selected="true"]{color:var(--ai);border-bottom-color:var(--ai);font-weight:700}
.fnote{font-size:12px;color:var(--muted);line-height:1.6}
.settings .bsheet-body{padding-top:16px;flex:1;min-height:0}
.bsheet.settings{height:min(84vh,640px)}
.tonept{display:flex;align-items:center;justify-content:center;gap:6px}
.tonept i{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);display:inline-block}
.swlist{display:flex;flex-direction:column;gap:6px}
.swrow{font:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.swrow span:first-child{display:flex;flex-direction:column;gap:2px}
.swrow small{font-size:12px;color:var(--muted)}
.swrow:disabled{opacity:.45;cursor:default}
.switch-ui{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.switch-ui i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.swrow[aria-checked="true"] .switch-ui{background:var(--ai)}
.swrow[aria-checked="true"] .switch-ui i{transform:translateX(16px)}
</style>
</head>

const synth = window.speechSynthesis || null;
let jaVoice = null, enVoice = null;
function pickVoice(){
  if (!synth) return;
  const all = synth.getVoices();
  const score = v => (/natural|online|neural/i.test(v.name)?4:0) + (/google/i.test(v.name)?2:0) + (v.localService?0:1);
  jaVoice = all.filter(v => /^ja(-|_|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a))[0] || null;
  const ens = all.filter(v => /^en(-|_|$)/i.test(v.lang));
  const enScore = v => score(v) + (/^en[-_]us/i.test(v.lang)?3:0);
  enVoice = ens.sort((a,b)=>enScore(b)-enScore(a))[0] || null;
}
if (synth){ pickVoice(); try { synth.addEventListener("voiceschanged", pickVoice); } catch(e){ synth.onvoiceschanged = pickVoice; } }

  if (!synth){ toast("這個瀏覽器不支援語音朗讀。"); return; }

  if (!(en ? enVoice : jaVoice)) pickVoice();
  const v = en ? enVoice : jaVoice;
  if (!v && !en){ toast("這台裝置沒有日文語音，可能唸不出來或發音不對。"); }
  synth.cancel();

}

const tabOf = m => (round && round.rv && m === round.mode) ? "rv" : (m === "rv" || ((m === "review" || m === "rreview" || m === "recapread") && isStudy())) ? "rv" : m === "home" ? "home" : m === "kanji" ? "kanji" : m === "card" ? "learn" : m === "bank" ? "bank" : (m === "recap" || m === "recapread" || m === "rreview") ? "recap" : "practice";

function poolFor(m){
  if (m === "recapread") return recapWords();
  if (m === "rreview") return recapWords().filter(w => isWeakR(w.id));
  let ws = allWords();
  if (level === "ono") ws = ws.filter(isOno);
  else if (level !== "all") ws = ws.filter(w => lvIs(w, level));
  if (m === "card") return ws;
  if (!isStudy()){ if (m === "review") return ws.filter(w => isWeak(w.id)); return ws; }
  ws = ws.filter(w => isLearned(w.id));
  if (m === "review") return ws.filter(w => isWeak(w.id));
  if (practiceScope === "today") ws = ws.filter(w => learnedToday(w.id));
  else if (practiceScope === "2d") ws = ws.filter(w => learned2d(w.id));
  if (m === "read") ws = ws.filter(w => hasKanji(w.w));
  return ws;
}
function startRound(m){
  const pool = poolFor(m);
  if (m === "review" || m === "rreview"){ round = {mode:m, ids:shuffle(pool).slice(0, m === "rreview" ? recapMax : ROUND).map(w=>w.id), i:0, res:[]}; }
  else if (m === "card"){
    // 先出還沒學過的字，再出最久沒看的字
    const fresh = shuffle(pool.filter(w => !isLearned(w.id)));
    const old = pool.filter(w => isLearned(w.id)).sort((a,b) => (learn[a.id].l||0) - (learn[b.id].l||0));
    round = {mode:m, ids:[...fresh, ...old].slice(0,cardRound).map(w=>w.id), i:0, res:[]};
  }
  else if (m === "recapread"){
    round = {mode:m, ids:sampleReview(pool), i:0, res:[]};
  }
  else {
    if (isStudy() && practiceScope === "2d" && m !== "review"){
      // 近兩天：錯的字（練習錯題、按過不記得）優先選進來，其餘隨機，最多 recapMax 題，順序打亂
      const bad = shuffle(pool.filter(w => isWeak(w.id) || (learn[w.id] && learn[w.id].r === 0)));
      const others = shuffle(pool.filter(w => !bad.includes(w)));
      round = {mode:m, ids:shuffle([...bad, ...others].slice(0, recapMax).map(w => w.id)), i:0, res:[]};
      newQ(); return;
    }
    const weak = shuffle(pool.filter(w=>isWeak(w.id)));
    const fresh = shuffle(pool.filter(w=>!stats[w.id]));
    const rest = shuffle(pool.filter(w=>stats[w.id] && !isWeak(w.id))).sort((a,b)=>(stats[a.id].t||0)-(stats[b.id].t||0));
    const pick = [...weak.slice(0,3), ...fresh, ...weak.slice(3), ...rest].slice(0,ROUND);
    round = {mode:m, ids:shuffle(pick.map(w=>w.id)), i:0, res:[]};
  }
  newQ();
}
function newQ(){ q = {wrong:0, done:false, flipped:false, picked:[]}; }
function finishQ(ok){
  if (q.done) return; q.done = true; q.ok = ok;
  const id = round.ids[round.i];
  round.res[round.i] = ok;
  if (mode === "card"){ markLearned(id); learn[id].r = ok ? 1 : 0; scheduleSave(); }
  else if (mode === "recapread" || mode === "rreview" || round.rv) recordR(id, ok);
  else record(id, ok);
}
function next(){
  round.i++;
  if (round.i >= round.ids.length){ q = null; } else newQ();
  render();
}

function readCands(c){
  const k = KANJI[c]; if (!k) return [];

    if (!b) continue;

const SPLIT_FIX = {"億劫":"おっ|くう","名残惜":"な|ごり|お","時計":"と|けい","迷子":"まい|ご","切符":"きっ|ぷ","可愛":"か|わい","草臥":"くた|び"};
// 把單字拆成 [{t, r}]：每個漢字盡量對到自己的讀音；拆不開時整段漢字一起標
function splitReading(w){
  const text = String(w.w).replace(/^〜/, ""), kana = toHira(String(w.k || "").replace(/^〜/, ""));
  const runs = []; for (const ch of text){ const k = isKanjiCh(ch); if (runs.length && runs[runs.length - 1].k === k) runs[runs.length - 1].t += ch; else runs.push({k, t: ch}); }
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const m = kana.match(new RegExp("^" + runs.map(r => r.k ? "(.+?)" : reEsc(toHira(r.t))).join("") + "$"));
  if (!m) return null;
  const segs = []; let i = 1;
  for (const r of runs){
    if (!r.k){ segs.push({t: r.t}); continue; }
    const rr = m[i++], chars = [...r.t];
    if (chars.length === 1){ segs.push({t: r.t, r: rr}); continue; }
    const solve = (ci, pos) => {
      if (ci === chars.length) return pos === rr.length ? [] : null;
      for (const cand of readCands(chars[ci])) if (rr.startsWith(cand, pos)){ const rest = solve(ci + 1, pos + cand.length); if (rest) return [{t: chars[ci], r: cand}, ...rest]; }
      return null;
    };
    let s = solve(0, 0);
    if (!s && SPLIT_FIX[r.t]){ const parts = SPLIT_FIX[r.t].split("|");
      for (const first of [parts[0], VOICE[parts[0][0]] ? VOICE[parts[0][0]] + parts[0].slice(1) : null].filter(Boolean)){
        const ps = [first, ...parts.slice(1)]; if (ps.join("") === rr){ s = chars.map((ch, j) => ({t: ch, r: ps[j]})); break; } } }
    if (s) segs.push(...s); else segs.push({t: r.t, r: rr, multi: true});
  }

}
// 這個漢字在這個單字裡的唸法（找不到就回傳 null）
function kanjiReadingIn(w, c){ const s = splitReading(w); if (!s) return null; const g = s.find(x => !x.multi && x.t === c); return g ? g.r : null; }
function wordRubyHL(w, c){
  const s = splitReading(w);

  return (String(w.w).startsWith("〜") ? "〜" : "") + s.map(x => { const hit = x.t.includes(c);
    const body = x.r ? `<ruby>${esc(x.t)}<rt>${esc(x.r)}</rt></ruby>` : esc(x.t);

function readingLabel(c, r){

function lvStatus(ws){
  let ok = 0, ng = 0;
  for (const w of ws){ if (!isLearned(w.id)) continue; const r = learn[w.id].r; if (r === 0 || isWeak(w.id)) ng++; else ok++; }
  return {ok, ng, nw: ws.length - ok - ng, n: ws.length};
}

// 複習抽題：不熟的字一定出（最多一半），其餘加權隨機，最多 recapMax 個，順序打亂
function sampleReview(pool){
    // 回顧複習：加權隨機抽最多 30 個——不熟的（回顧錯題、練習錯題、自評不記得、熟練度低）和越久沒複習的越容易被抽到，最後打亂順序
    const now = Date.now();
    const weight = w => {
      const id = w.id, ms = mastery(id), rt = (rstats[id] && rstats[id].t) || 0;
      let x = 1;
      if (isWeakR(id)) x += 4;
      if (isWeak(id)) x += 2;
      if (learn[id] && learn[id].r === 0) x += 2;
      if (ms !== null) x += (1 - ms) * 3;
      x += Math.min(7, rt ? (now - rt) / 86400000 : 7) / 2;   // 越久沒複習越優先，最多加 3.5
      if (rt >= todayStart()) x *= 0.3;                         // 今天已經複習過的降低
      return x;
    };
    // 不熟的字（回顧錯題、練習錯題、按過不記得）一定會出，最多佔一半；其餘名額加權隨機抽
    const weakIds = shuffle(pool.filter(w => isWeakR(w.id) || isWeak(w.id) || (learn[w.id] && learn[w.id].r === 0)).map(w => w.id)).slice(0, Math.ceil(recapMax / 2));
    const items = pool.filter(w => !weakIds.includes(w.id)).map(w => ({id: w.id, k: Math.pow(Math.random(), 1 / weight(w))}));   // 加權隨機抽樣
    items.sort((a, b) => b.k - a.k);
    return shuffle([...weakIds, ...items.slice(0, recapMax - weakIds.length).map(x => x.id)]);
}
// 複習分頁：用選好的題型，從回顧範圍抽題
let rvType = "read", grvType = "choice";
try { const t0 = localStorage.getItem("n1drill-rvtype"); if (["read","listen","choice","fill"].includes(t0)) rvType = t0; const g0 = localStorage.getItem("n1drill-grvtype"); if (G_TYPES.includes(g0)) grvType = g0; } catch(e){}
function rvPool(type, all){ let ws = all ? learnedWords() : recapWords(); if (type === "read") ws = ws.filter(w => hasKanji(w.w)); return ws; }
function startReview(type, total){
  const pool = rvPool(type, total); if (!pool.length){ mode = "rv"; round = null; renderTabs(); render(); return; }
  mode = type; round = {mode:type, ids:sampleReview(pool), i:0, res:[], rv:true, total:!!total}; newQ();
  renderTabs(); render(); window.scrollTo({top:0});
}

// ---------- 首頁：今天要做的事 ----------
function todoHTML(ws, newToday, weak){
  const t0 = todayStart(), w0 = weekStart(), U = isGram() ? "文法" : "字";
  const w2 = ws.filter(w => learned2d(w.id));
  const bad2 = w2.filter(w => isWeak(w.id) || learn[w.id].r === 0).length;
  const un2 = w2.filter(w => !(stats[w.id] && stats[w.id].t >= t0)).length;
  const todayWs = ws.filter(w => learn[w.id] && (learn[w.id].f || 0) >= t0);
  const unpracticed = todayWs.filter(w => !(stats[w.id] && stats[w.id].t >= t0)).length;
  // 每週：回顧＝最近幾天學過的（不含今天新學）這週都複習過；總複習＝這週從全部學過的抽題做完一輪
  const rws = ws.filter(w => isLearned(w.id) && lastTouch(w.id) >= recentCutoff() && !((learn[w.id].f || 0) >= t0));
  const unreviewed = rws.filter(w => !(rstats[w.id] && rstats[w.id].t >= w0)).length;
  const learnedN = ws.filter(w => isLearned(w.id)).length;
  const totalAt = (tasks[dom] && tasks[dom].total) || 0, totalDone = totalAt >= w0;
  const lvName = level === "all" ? "" : level === "ono" ? "擬聲擬態・" : `${level}・`;
  const daily = [
    {k:"card", t:`翻牌學新${U}`, s: newToday >= dailyGoal ? `今天學了 ${newToday} 個（目標 ${dailyGoal}）` : `${lvName}今天 ${newToday} / ${dailyGoal}`, done: newToday >= dailyGoal, pct: Math.min(1, newToday / dailyGoal)},
    {k:"practice", t:`練習今天的${U}`, s: !todayWs.length ? "先翻牌學幾個" : unpracticed ? `還有 ${unpracticed} 個沒練` : "今天的都練過了", done: todayWs.length > 0 && !unpracticed, off: !todayWs.length},
    {k:"practice2", t:"短期複習", s: !w2.length ? `今天和昨天還沒學${U}` : `今天＋昨天 ${w2.length} 個${bad2 ? `・錯的 ${bad2} 個優先` : ""}`, done: w2.length > 0 && !un2, off: !w2.length},
  ];
  const md = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}（${"日一二三四五六"[d.getDay()]}）`; };
  const weekly = [
    {k:"recap", t:"回顧", s: !rws.length ? `最近 ${recapDays} 天還沒有以前學的${U}` : unreviewed ? `最近 ${recapDays} 天的 ${rws.length} 個・本週還有 ${unreviewed} 個沒複習` : "本週都複習過了", done: rws.length > 0 && !unreviewed, off: !rws.length, pct: rws.length ? (rws.length - unreviewed) / rws.length : undefined},
    {k:"total", t:"總複習", s: !learnedN ? `還沒有學過的${U}` : totalDone ? `本週已完成・${md(totalAt)}` : `從全部學過的 ${learnedN} 個抽 ${Math.min(learnedN, recapMax)} 題，不熟的優先`, done: totalDone, off: !learnedN},
  ];
  const sec = (title, items, sub) => { const doneN = items.filter(x => x.done).length;
    return `<div class="row" style="justify-content:space-between"><h2>${title}<span class="tr" style="font-weight:400">　${sub}</span></h2><span class="tr">${doneN} / ${items.length} 完成</span></div>
    <div class="tdl">${items.map((x, i) => `<button class="td${x.done?" done":""}${x.off?" off":""}${x.warn?" warn":""}" data-todo="${x.k}">
      <span class="tdck" aria-hidden="true">${x.done ? "✓" : i + 1}</span>
      <span class="tdtx"><b>${x.t}</b><small>${x.s}</small>${x.pct !== undefined && !x.done ? `<span class="tdbar"><i style="width:${Math.round(x.pct*100)}%"></i></span>` : ""}</span>
      <span class="tdgo" aria-hidden="true">›</span></button>`).join("")}</div>`; };
  const we = new Date(w0 + 6 * 86400000);
  return `<div class="card htodo">${sec("每日任務", daily, "每天 0 點重置")}</div>
    <div class="card htodo">${sec("每週任務", weekly, `到 ${we.getMonth()+1}/${we.getDate()}（日）`)}</div>`;
}
// 今天已達標時，點「翻牌學新字」先問：繼續學新字，還是再翻一次今天的字
function askAfterGoal(nt){
  const ov = document.createElement("div"); ov.className = "sheetov";
  ov.innerHTML = `<div class="bsheet askgoal" role="dialog" aria-modal="true" aria-label="今天的目標已完成">

    <div class="bsheet-body"><div class="tr">今天已經學了 ${nt} 個新字（目標 ${dailyGoal} 個）。接下來想做什麼？</div>
      <button class="agopt" data-ag="again"><b>再翻一次今天的字</b><small>把今天學的 ${nt} 個字隨機再翻一遍，不算新學</small></button>
      <button class="agopt" data-ag="new"><b>繼續學新字</b><small>多學幾個，超過目標也沒關係</small></button>
    </div></div>`;
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("click", e => {
    if (e.target === ov || e.target.closest("[data-x]")) return close();
    const b = e.target.closest("[data-ag]"); if (!b) return;
    close();
    mode = "card"; cardStarted = true;
    if (b.dataset.ag === "again"){
      const t0 = todayStart();
      const ids = shuffle(allWords().filter(w => learn[w.id] && (learn[w.id].f || 0) >= t0).map(w => w.id));
      round = {mode:"card", ids, i:0, res:[], again:true}; newQ();
    } else round = null;
    renderTabs(); render(); window.scrollTo({top:0});
  });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov);
}
function runTodo(k){
  if (k === "card"){
    const nt = newTodayCount();
    if (nt >= dailyGoal) return askAfterGoal(nt);
    mode = "card"; cardStarted = true; round = null;
  }
  else if (k === "practice"){ practiceScope = "today"; try { localStorage.setItem("n1drill-scope", "today"); } catch(e){} mode = practiceDefault(); if (mode === "review") mode = "read"; round = null; }
  else if (k === "review"){ mode = "review"; round = null; }
  else if (k === "practice2"){ practiceScope = "2d"; try { localStorage.setItem("n1drill-scope", "2d"); } catch(e){} mode = practiceDefault(); if (mode === "review") mode = "read"; round = null; }
  else if (k === "rreview"){ recapRange = "all"; try { localStorage.setItem("n1drill-recap", "all"); } catch(e){} mode = "rreview"; round = null; }
  else if (k === "recap"){ recapRange = "7"; try { localStorage.setItem("n1drill-recap", "7"); } catch(e){} mode = "rv"; round = null; }
  else if (k === "total"){ return startReview(isGram() ? grvType : rvType, true); }
  renderTabs(); render(); window.scrollTo({top:0});

function choicesFor(w){
  const p = parse(w);

  if (ds.length < 3){
    const others = shuffle(allWords().filter(o => o.id!==w.id && (o.pos||"")===(w.pos||"")).map(o=>parse(o).blank));
    const more = shuffle(allWords().filter(o => o.id!==w.id).map(o=>parse(o).blank));
    for (const x of [...others, ...more]) { if (ds.length>=3) break; if (x!==p.blank && !ds.includes(x)) ds.push(x); }
  }

}

function gMeanOpts(w){

function connCats(w){

  const bad = new Set(cats);
  if (cats.includes("普通形")) [...plain, "名詞", "名詞の"].forEach(x => bad.add(x));   // 普通形已經包含名詞的接法
  if (cats.some(x => plain.includes(x))) bad.add("普通形");

let slowSpeech = false;

let sampleFn = null;   // Claude 判斷意思（選用）
const stripParen = s => String(s||"").replace(/（[^）]*）|\([^)]*\)/g, "");
const cleanZh = s => String(s||"").normalize("NFKC").replace(/[\s。，、,.;；:：!！?？「」『』"'…〜~・\-—]/g, "");
function meaningCands(m){
  const base = stripParen(m);
  const parts = base.split(/[、，,；;／/]/).map(cleanZh).filter(Boolean);
  const whole = cleanZh(base);
  return [...new Set([...parts, whole].filter(Boolean))];
}
function lev(a, b){
  a = [...a]; b = [...b];
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for (let j=1;j<=b.length;j++) d[0][j] = j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
// 回傳 "ok"｜"close"（接近，算對）｜"maybe"（差一個字，請使用者確認）｜"ng"
function judgeMeaning(input, m){
  const us = String(input||"").split(/[、，,；;／/\s]/).map(cleanZh).filter(Boolean);
  if (!us.length) return "empty";
  const cs = meaningCands(m);
  let best = "ng";
  for (const u of us) for (const c of cs){
    if (u === c) return "ok";
    const ul = [...u].length, cl = [...c].length;
    if (ul >= 2 && c.includes(u)) return "ok";
    if (cl >= 2 && u.includes(c)) return "ok";
    if (ul === 1 && cl === 1 && u === c) return "ok";
    const dist = lev(u, c), mx = Math.max(ul, cl);
    if (mx === 2 && dist === 1 && best !== "close") best = "maybe";   // 兩個字差一個：讓使用者確認是不是選字打錯
    else if (mx >= 3 && dist <= Math.max(1, Math.floor(mx/3))) best = "close";
    const set = new Set([...c]); const common = [...u].filter(ch => set.has(ch)).length;
    if (mx >= 3 && (2*common)/(ul+cl) >= 0.67) best = "close";
  }
  return best;
}

const KANJI_RE = /[㐀-鿿々〆ヶ]/;
// 其他寫法（顯示用）：有 forms 用 forms，否則用 alt（alt 也拿來判斷答案，可能含活用形）
const formsOf = w => Array.isArray(w.forms) ? w.forms : (w.alt || []);
const kanjiCount = s => [...String(s)].filter(c => KANJI_RE.test(c)).length;
function cardForm(w){

const toHira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function furigana(text, kana){
  text = String(text); kana = toHira(String(kana||"").replace(/^〜/,""));
  if (!KANJI_RE.test(text) || !kana) return esc(text);
  const runs = []; for (const c of text){ const k = KANJI_RE.test(c); if (runs.length && runs[runs.length-1].k === k) runs[runs.length-1].t += c; else runs.push({k, t:c}); }
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const m = kana.match(new RegExp("^" + runs.map(r => r.k ? "(.+?)" : reEsc(toHira(r.t))).join("") + "$"));
  if (!m) return `<ruby>${esc(text)}<rt>${esc(kana)}</rt></ruby>`;
  let i = 1; return runs.map(r => r.k ? `<ruby>${esc(r.t)}<rt>${esc(m[i++])}</rt></ruby>` : esc(r.t)).join("");
}
// 文法標題的假名：把讀音對到每一段漢字上；〜 和括號裡的部分可有可無
function gFuriSegs(text, kana){
  text = String(text); kana = toHira(String(kana || ""));
  if (!KANJI_RE.test(text) || !kana) return null;
  const toks = []; let i = 0;
  const cs = [...text];
  while (i < cs.length){
    const c = cs[i];
    if (c === "（" || c === "("){ let j = i + 1, inner = ""; while (j < cs.length && cs[j] !== "）" && cs[j] !== ")") inner += cs[j++]; toks.push({opt:true, t:inner, raw:c + inner + (cs[j] || "")}); i = j + 1; continue; }
    if (KANJI_RE.test(c)){ let t = c; while (i + 1 < cs.length && KANJI_RE.test(cs[i+1])) t += cs[++i]; toks.push({k:true, t}); i++; continue; }
    toks.push({t:c}); i++;
  }
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const lit = s => [...s].map(ch => ch === "〜" ? "〜?" : reEsc(toHira(ch))).join("");
  const re = "^" + toks.map(t => t.k ? "(.+?)" : t.opt ? "(?:" + lit(t.t) + ")?" : lit(t.t)).join("") + "$";
  const m = kana.replace(/〜/g, "").match(new RegExp(re.replace(/〜\?/g, "")));
  if (!m) return null;
  let g = 1; return toks.map(t => t.k ? {t:t.t, r:m[g++]} : {t:t.raw || t.t});
}

// 翻牌左右滑：右＝記得、左＝不記得；輕點＝翻開
function bindSwipe(el, done, tap){
  if (!el) return;
  let x0 = null, y0 = 0, dx = 0, id = null, moved = false;
  const ok = el.querySelector(".swl.ok"), ng = el.querySelector(".swl.ng");
  const set = d => { el.style.transform = `translateX(${d}px) rotate(${d/18}deg)`; const t = Math.min(1, Math.abs(d)/90); ok.style.opacity = d > 0 ? t : 0; ng.style.opacity = d < 0 ? t : 0; el.classList.toggle("sw-ok", d > 60); el.classList.toggle("sw-ng", d < -60); };
  el.addEventListener("pointerdown", e => { if (e.target.closest("button,a,[data-say],[data-star]")) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; id = e.pointerId; el.style.transition = "none"; });
  el.addEventListener("pointermove", e => { if (x0 === null || e.pointerId !== id) return; dx = e.clientX - x0;
    if (!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)){ moved = true; try { el.setPointerCapture(id); } catch(_){} }
    if (moved) set(dx); });
  const end = e => { if (x0 === null || e.pointerId !== id) return; x0 = null; el.style.transition = "transform .25s ease";
    if (moved && Math.abs(dx) > 90){ const r = dx > 0; el.style.transform = `translateX(${r ? 480 : -480}px) rotate(${r ? 22 : -22}deg)`; el.style.opacity = "0"; el.style.transition += ", opacity .25s"; setTimeout(() => done(r), 220); }
    else { set(0); if (!moved && e.type === "pointerup") tap(); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

}

let sleepCfg = {gap:4, order:"seq", timer:30, slow:true, twice:false};
try { sleepCfg = {...sleepCfg, ...JSON.parse(localStorage.getItem("n1drill-sleep")||"{}")}; } catch(e){}
let zhVoice = null;
function pickZh(){
  if (!synth) return null;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /^zh[-_](TW|Hant)/i.test(v.lang)) || vs.find(v => /^zh[-_]HK/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null;
  return zhVoice;
}
function speakP(text, lang, rate, isOn){
  return new Promise(res => {
    if (!synth || !text || !isOn()) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate || 0.9;
    if (/^ja/.test(lang)){ if (!jaVoice) pickVoice(); if (jaVoice) u.voice = jaVoice; }
    else if (/^en/.test(lang)){ if (!enVoice) pickVoice(); if (enVoice) u.voice = enVoice; }
    else { if (!zhVoice) pickZh(); if (zhVoice) u.voice = zhVoice; }
    let done = false; const fin = () => { if (!done){ done = true; clearTimeout(tm); res(); } };
    const tm = setTimeout(fin, Math.max(5000, [...text].length * 450));
    u.onend = fin; u.onerror = fin;
    synth.speak(u);
  });
}
const waitP = (ms, isOn) => new Promise(res => { const t0 = Date.now(); const tick = () => (!isOn() || Date.now()-t0 >= ms) ? res() : setTimeout(tick, 200); tick(); });
function openSleep(words){
  const items = words.slice();
  if (!items.length) return;
  let order = sleepCfg.order === "rand" ? shuffle(items) : items.slice();
  let idx = 0, playing = false, token = 0, startedAt = 0, wake = null;
  const ov = document.createElement("div"); ov.className = "sleep";
  const save = () => { try { localStorage.setItem("n1drill-sleep", JSON.stringify(sleepCfg)); } catch(e){} };
  const lockWake = async () => { try { wake = await navigator.wakeLock?.request("screen"); } catch(e){ wake = null; } };
  const onVis = () => { if (document.visibilityState === "visible" && playing) lockWake(); };
  document.addEventListener("visibilitychange", onVis);
  const draw = () => {
    const w = order[idx % order.length];
    ov.innerHTML = `<div class="sleep-in">
      <div class="sleep-top"><span>睡眠播放・${items.length} 個${dom==="grammar"?"文法":"字"}</span><button class="sbtn ghost" data-act="close">關閉</button></div>
      <div class="sleep-now">
        <div class="sw">${wHTML(w)}</div>
        ${!isGrammar(w)&&norm(w.k)!==norm(w.w)?`<div class="sk">${esc(w.k)}</div>`:""}
        <div class="sm">${esc(w.m||"")}</div>
        <div class="sp">${(idx % order.length)+1} / ${order.length}</div>
      </div>
      <div class="sleep-ctl">
        <button class="sbtn" data-act="prev" aria-label="上一個">‹</button>
        <button class="sbtn main" data-act="toggle">${playing?"暫停":"開始播放"}</button>
        <button class="sbtn" data-act="next" aria-label="下一個">›</button>
      </div>
      <div class="sleep-opt">
        <label>間隔<select data-cfg="gap">${[[2,"短"],[4,"中"],[7,"長"]].map(([v,l])=>`<option value="${v}" ${sleepCfg.gap==v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label>順序<select data-cfg="order"><option value="seq" ${sleepCfg.order==="seq"?"selected":""}>依序</option><option value="rand" ${sleepCfg.order==="rand"?"selected":""}>隨機</option></select></label>
        <label>自動停止<select data-cfg="timer">${[[15,"15 分"],[30,"30 分"],[60,"60 分"],[0,"不停止"]].map(([v,l])=>`<option value="${v}" ${sleepCfg.timer==v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label><input type="checkbox" data-cfg="slow" ${sleepCfg.slow?"checked":""}>慢速</label>
        <label><input type="checkbox" data-cfg="twice" ${sleepCfg.twice?"checked":""}>單字唸兩次</label>
      </div>
      <div class="sleep-note">${playing?(sleepCfg.timer?`${sleepCfg.timer} 分鐘後自動停止。`:"會一直循環播放。"):"播放時請讓這個畫面保持開著；手機鎖螢幕後，有些瀏覽器會停止朗讀。"}</div>
    </div>`;
  };
  const stop = msg => { playing = false; token++; try { synth && synth.cancel(); } catch(e){} try { wake && wake.release(); } catch(e){} wake = null; draw(); if (msg) toast(msg); };
  const run = async (my) => {
    const isOn = () => playing && token === my;
    const firstLang = isEn() ? "en-US" : "ja-JP";
    while (isOn()){
      if (sleepCfg.timer && Date.now() - startedAt > sleepCfg.timer * 60000){ stop("已自動停止，晚安。"); return; }
      const w = order[idx % order.length]; draw();
      const rate = sleepCfg.slow ? 0.7 : 0.9;
      const word = w.w.replace(/^〜/,"");
      await speakP(word, firstLang, rate, isOn);
      if (sleepCfg.twice){ await waitP(900, isOn); await speakP(word, firstLang, rate, isOn); }
      await waitP(1000, isOn);
      await speakP(String(w.m||"").replace(/[；;／/]/g,"，"), "zh-TW", sleepCfg.slow ? 0.85 : 1, isOn);
      await waitP(sleepCfg.gap * 1000, isOn);
      if (!isOn()) return;
      idx++;
      if (idx % order.length === 0 && sleepCfg.order === "rand"){ order = shuffle(items); idx = 0; }
    }
  };
  const start = () => { if (!synth){ toast("這個瀏覽器不支援語音朗讀。"); return; } playing = true; token++; startedAt = Date.now(); lockWake(); draw(); run(token); };
  const close = () => { stop(); document.removeEventListener("visibilitychange", onVis); document.removeEventListener("keydown", onKey); ov.remove(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "close") return close();
    if (a === "toggle") return playing ? stop() : start();
    if (a === "next" || a === "prev"){
      idx = (idx + (a === "next" ? 1 : order.length - 1)) % order.length;
      if (playing){ token++; try { synth.cancel(); } catch(e){} run(token); } else draw();
    }
  });
  ov.addEventListener("change", e => {
    const el = e.target.closest("[data-cfg]"); if (!el) return;
    const k = el.dataset.cfg;
    sleepCfg[k] = el.type === "checkbox" ? el.checked : (k === "order" ? el.value : Number(el.value));
    if (k === "order"){ order = sleepCfg.order === "rand" ? shuffle(items) : items.slice(); idx = 0; }
    save();
  });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov); draw();
  ov.querySelector('[data-act="toggle"]').focus();
}
