  const rb = $("#rootsBox"); if (rb) rb.addEventListener("toggle", () => { rootsOpen = rb.open; try { localStorage.setItem("n1drill-roots", rootsOpen ? "1" : "0"); } catch(e){} });
  revealStrips();
  const back = $("#backAll"); if (back) back.onclick = () => { bankFilter = "all"; renderBank(main); };
  const gf = $("#gramForm");
  if (gf) gf.onsubmit = async e => {
    e.preventDefault();
    const val = id => $(id).value.trim(), msg = $("#gramMsg"), s = val("#g-s");
    const m = s.match(/【(.+?)】/);
    if (!m){ msg.textContent = "例句裡要用【】標出文法的部分。"; return; }
    const item = { w: val("#g-w"), k: m[1], bk: m[1], m: val("#g-m"), lv: $("#g-lv").value, conn: val("#g-conn"), s, tr: val("#g-tr"),
      roots: val("#g-cat") ? [val("#g-cat")] : [], d: val("#g-d").split(/[,，、]/).map(x=>x.trim()).filter(Boolean), created: Date.now() };
    const note = val("#g-note"); if (note) item.note = note;
    try { await db.collection("grammar").add(item); gf.reset(); msg.textContent = `已加入「${item.w}」`; toast(`已加入「${item.w}」`); }
    catch(err){ msg.textContent = "新增失敗，請稍後再試。"; }
  };
  const f = $("#addForm");
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const val = id => $(id).value.trim();
    const s = val("#f-s");
    const msg = $("#addMsg");
    if (!/【.+?】/.test(s)){ msg.textContent = "例句裡要用【】標出挖空的部分。"; return; }
    const word = { w:val("#f-w"), k:norm(val("#f-k")), m:val("#f-m"), pos:$("#f-pos").value, lv:$("#f-lv").value, ...($("#f-daily").checked ? {daily:true} : {}), s, tr:val("#f-tr"),
      roots: val("#f-roots").split(/[,，、\s]/).map(x=>x.trim()).filter(Boolean),
      d: val("#f-d").split(/[,，、]/).map(x=>x.trim()).filter(Boolean), created: Date.now() };
    const bk = norm(val("#f-bk")); if (bk) word.bk = bk;
    const p = parse(word);
    if (p.blank !== word.w && !bk && hasKanji(p.blank)){ msg.textContent = "挖空處和單字原形不同，請填寫挖空處的讀音。"; return; }
    try { await db.collection("words").add(word); f.reset(); msg.textContent = `已加入「${word.w}」`; }
    catch(err){ msg.textContent = err?.code==="quota_exceeded" ? "題庫已滿，請先刪除一些單字。" : "新增失敗，請稍後再試。"; }
  };
}

// ---------- 詳細頁左右滑：卡片跟著手指移動、傾斜；放開超過門檻就飛出去，下一張從另一邊滑進來 ----------
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const detRest = ov => [...ov.querySelectorAll(".det > :not(.det-top):not(.det-card)")];
function detSlideIn(ov, dir){
  if (reduceMotion() || !dir) return;
  const card = ov.querySelector(".det-card"); if (!card || !card.animate) return;
  card.animate([{transform:`translateX(${dir * 70}%) rotate(${dir * 7}deg)`, opacity:0}, {transform:"none", opacity:1}], {duration:300, easing:"cubic-bezier(.2,.8,.3,1)"});
  detRest(ov).forEach((el, k) => el.animate([{transform:`translateX(${dir * 40}px)`, opacity:0}, {transform:"none", opacity:1}], {duration:300, delay:60 + k * 25, easing:"ease-out", fill:"backwards"}));
}
function bindDetSwipe(ov, canGo, go){
  let x0 = null, y0 = 0, dx = 0, pid = null, moved = false, card = null, busy = false;
  const set = d => {
    const lim = canGo(d < 0 ? 1 : -1) ? d : d * 0.25;   // 沒有上一個／下一個時只能拉一點點（有阻力）
    card.style.transform = `translateX(${lim}px) rotate(${lim / 22}deg)`;
    const o = Math.max(0.3, 1 - Math.abs(lim) / 420);
    detRest(ov).forEach(el => { el.style.opacity = o; el.style.transform = `translateX(${lim * 0.3}px)`; });
  };
  const clear = els => els.forEach(el => { el.style.transition = ""; el.style.transform = ""; el.style.opacity = ""; });
  ov.addEventListener("pointerdown", e => {
    if (busy || (e.pointerType === "mouse" && e.button !== 0) || e.target.closest("button,a,input,select,[data-say],[data-star]")) return;
    card = ov.querySelector(".det-card"); if (!card) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; pid = e.pointerId;
  });
  ov.addEventListener("pointermove", e => {
    if (x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!moved){
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }   // 上下捲動就不處理
      if (Math.abs(dx) < 8) return;
      moved = true; ov.classList.add("dragging"); try { ov.setPointerCapture(pid); } catch(_){}
      [card, ...detRest(ov)].forEach(el => el.style.transition = "none");
    }
    set(dx);
  });
  const end = e => {
    if (x0 === null || e.pointerId !== pid) return;
    x0 = null; ov.classList.remove("dragging"); if (!moved) return;
    const dir = dx < 0 ? 1 : -1, els = [card, ...detRest(ov)];
    if (Math.abs(dx) > 70 && canGo(dir)){
      busy = true;
      card.style.transition = "transform .2s ease-in, opacity .2s ease-in";
      card.style.transform = `translateX(${-dir * (window.innerWidth + 80)}px) rotate(${-dir * 16}deg)`; card.style.opacity = "0";
      detRest(ov).forEach(el => { el.style.transition = "opacity .18s, transform .2s"; el.style.opacity = "0"; el.style.transform = `translateX(${-dir * 60}px)`; });
      setTimeout(() => { busy = false; go(dir); }, 190);
    } else {
      els.forEach(el => el.style.transition = "transform .3s cubic-bezier(.2,.8,.3,1), opacity .3s");
      els.forEach(el => { el.style.transform = ""; el.style.opacity = ""; });
      setTimeout(() => clear(els), 320);
    }
  };
  ov.addEventListener("pointerup", end); ov.addEventListener("pointercancel", end);
}
// ---------- 詳細頁（文法）：大卡片＋接續＋意思＋例句，可左右切換 ----------
function exampleHTML(s, tr){
  const m = String(s).match(/^(.*?)【(.+?)】(.*)$/);
  const plain = m ? m[1]+m[2]+m[3] : s;
  const html = m ? `${esc(m[1])}<em>${esc(m[2])}</em>${esc(m[3])}` : esc(s);
  return `<li class="dex"><div class="dexs"><div class="dexj">${html}</div>${tr?`<div class="dext">${esc(tr)}</div>`:""}</div>${spk(plain,"唸例句")}</li>`;
}
function openDetail(list, idx){
  if (!list.length) return;
  const ov = document.createElement("div"); ov.className = "detov";
  let i = idx;
  const draw = () => {
    const w = list[i];
    const exs = [{s:w.s, tr:w.tr}, ...(w.ex||[])].filter(x => x && x.s);
    const groups = rootsOf(w).filter(r => rootInfo[r]);
    ov.innerHTML = `<div class="det" role="dialog" aria-modal="true" aria-label="${esc(w.w)}">
      <div class="det-top"><button class="det-back" data-close aria-label="返回">‹</button><span class="det-lv">${esc(lvText(w))}</span><span class="det-pos">${i+1} / ${list.length}</span></div>
      <div class="det-card">
        <div class="det-say">${spk(w.w.replace(/^〜/,""),"播放發音")}</div>${starBtn(w.id, "detstar")}
        ${i>0?`<button class="det-nav prev" data-nav="-1" aria-label="上一個">‹</button>`:""}
        ${i<list.length-1?`<button class="det-nav next" data-nav="1" aria-label="下一個">›</button>`:""}
        ${formsOf(w).length?`<div class="det-alt">${formsOf(w).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
        <div class="det-w">${wHTML(w)}</div>
        ${!isGrammar(w)&&w.k&&norm(w.k)!==norm(w.w)?`<div class="det-k${isEn()?" ipa":""}">${esc(w.k)}</div>`:""}
        ${w.conn?`<div class="det-conn">${esc(w.conn)}</div>`:""}
        ${!isGrammar(w)&&(w.pos||conjugations(w).length)?`<div class="det-tags">${w.pos?`<span class="pos">${esc(w.pos)}</span>`:""}${conjugations(w).length?`<button class="conjbtn2" data-dconj="${esc(w.id)}">${conjLabel(w)}</button>`:""}</div>`:""}
        <div class="det-rule"></div>
        <div class="det-m">${esc(w.m||"")}</div>
        ${w.note?`<div class="det-note">${esc(w.note)}</div>`:""}
      </div>
      ${groups.length?`<div class="det-groups">${groups.map(r=>`<span class="det-chip"><b>${esc(r)}</b>${esc(rootInfo[r].m)}</span>`).join("")}</div>`:""}
      ${!isGrammar(w)&&rootsOf(w).some(r=>familyOf(r).length>1)?`<div class="det-sec"><span>同字根</span></div><div class="det-fam">${rootsOf(w).map(r=>{const fam=familyOf(r).filter(x=>x.id!==w.id).slice(0,8);return fam.length?`<div class="famrow"><b>${esc(r)}</b>${fam.map(x=>`<span class="famw">${esc(x.w)}<small>${esc(x.m||"")}</small></span>`).join("")}</div>`:"";}).join("")}</div>`:""}
      <div class="det-sec"><span>例句</span></div>
      <ul class="det-exs">${exs.map(x => exampleHTML(x.s, x.tr)).join("")}</ul>
    </div>`;
    ov.scrollTop = 0;
  };
  const go = d => { const n = i + d; if (n < 0 || n >= list.length) return; i = n; draw(); detSlideIn(ov, d); };
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (document.querySelectorAll(".detov").length > 1 && ov !== [...document.querySelectorAll(".detov")].pop()) return; if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); };
  ov.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) return close();
    const cj = e.target.closest("[data-dconj]"); if (cj){ openConj(byId(cj.dataset.dconj)); return; }
    const n = e.target.closest("[data-nav]"); if (n) go(+n.dataset.nav);
  });
  bindDetSwipe(ov, d => i + d >= 0 && i + d < list.length, go);
  document.addEventListener("keydown", onKey);
  draw(); document.body.appendChild(ov);
  ov.querySelector("[data-close]").focus();
}

function openBankSheet(main){
  const draft = {...bankCfg, pos:[...asArr(bankCfg.pos)], type:[...asArr(bankCfg.type)]};
  const vocab = isVocab(), g = dom === "grammar";
  const groups = {}; allWords().forEach(w => { const [gk, s] = posSub(w); (groups[gk] = groups[gk] || new Set()).add(s); });
  const jaPosOpts = [["all","全部"], ...["名詞","verb","adj","副詞","量詞","慣用語","其他"].filter(k => groups[k]).map(k => [k, POS_SUB[k] ? POS_SUB[k].label : k])];
  let subOpen = null;
  const posLabel = v => { const [vg, vs] = String(v).split(":"); if (!POS_SUB[vg]) return null; const s = vs && POS_SUB[vg].subs.find(x => x[0] === vs); return POS_SUB[vg].label + (s ? "・" + s[1].replace(/動詞|形容詞/,"") : ""); };
  const posOpts = [...new Set(allWords().map(posCat))].sort((a,b) => { const i = POS_ORDER.indexOf(a), j = POS_ORDER.indexOf(b); return (i<0?99:i) - (j<0?99:j) || a.localeCompare(b); });
  const rows = [
    ["sort","排序",[["seq","順序"],["rev","倒序"]]],
    ...(!g && posOpts.length > 1 ? [["pos","詞性", isEn() ? [["all","全部"], ...posOpts.map(p=>[p,p])] : jaPosOpts]] : []),
    ...(vocab ? [["type","類型",[["all","全部"],["plain","一般"],["ono","擬聲擬態"],["loan","外來語"],["classic","古文"]]],
                 ["kanji","漢字",[["all","全部"],["yes","有漢字"],["no","無漢字"]]]] : []),
    ["status","狀態", vocab ? [["all","全部"],["star","★ 收藏"],["learned","學過的"],["new","還沒學"],["mastered","已經熟了"],["weak","練習錯題"],["rweak","回顧錯題"]] : [["all","全部"],["mastered","已經熟了"],["weak","錯題"]]],
  ];
  const ov = document.createElement("div"); ov.className = "sheetov";
  let subAnim = false;
  const optLabel = (k, opts, v) => { const neg = v[0] === "!", b = neg ? v.slice(1) : v;
    return (neg ? "排除 " : "") + ((k === "pos" && posLabel(b)) || (opts.find(o => o[0] === b) || [,b])[1]); };
  const summary = (k, opts) => {
    if (MULTI_KEYS.includes(k)){ const a = draft[k]; if (!a.length) return "";
      return `<em>${a.map(v => `<span class="${v[0]==="!"?"negt":""}">${esc(optLabel(k, opts, v))}</span>`).join("、")}</em>`; }
    if (draft[k] === BANK_DEFAULT[k]) return "";
    return `<em class="${String(draft[k])[0]==="!"?"neg":""}">${esc(optLabel(k, opts, String(draft[k])))}</em>`;
  };
  const hint = k => k === "type" ? "可複選・點兩下＝排除" : k === "pos" ? "可複選" : TRI_KEYS.includes(k) ? "點兩下＝排除" : "";
  const grpCount = gk => draft.pos.filter(v => v === gk || v.startsWith(gk + ":")).length;
  const MF = [["weak","不熟的優先"],["strong","熟的優先"]];
  const sortRow = () => {
    const sm = [draft.sort === "rev" ? "倒序" : "", (MF.find(x => x[0] === draft.mfirst) || [,""])[1]].filter(Boolean).join("・");
    return `<div class="frow"><div class="flabel"><span>排序</span>${sm ? `<em>${sm}</em>` : ""}</div><div class="fopts sortopts">
      ${[["seq","順序"],["rev","倒序"]].map(([v,l]) => `<button class="fopt" data-k="sort" data-v="${v}" aria-pressed="${draft.sort===v}">${l}</button>`).join("")}
      <span class="fdiv" aria-hidden="true"></span>
      ${MF.map(([v,l]) => `<button class="fopt" data-k="mfirst" data-v="${v}" aria-pressed="${draft.mfirst===v}">${l}</button>`).join("")}</div></div>`;
  };
  const rowHTML = (k, label, opts) => {
    if (k === "sort") return sortRow();
    const multi = MULTI_KEYS.includes(k), cur = draft[k];
    const sm = summary(k, opts), hn = hint(k);
    const btns = opts.map(([v,l]) => {
      const grp = k === "pos" && POS_SUB[v];
      if (grp){ const c = grpCount(v), one = c === 1 ? draft.pos.find(x => x === v || x.startsWith(v + ":")) : null;
        return `<button class="fopt grp" data-grp="${v}" aria-pressed="${c>0}" aria-expanded="${subOpen===v}">${esc(one ? posLabel(one) : c > 1 ? `${l}・${c}` : l)}<span class="caret">▾</span></button>`; }
      let on, neg = false;
      if (multi){ on = v === "all" ? !cur.length : cur.includes(v); neg = cur.includes("!" + v); }
      else { on = cur === v; neg = cur === "!" + v; }
      return `<button class="fopt" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on || neg}" ${neg?'data-neg="true"':""}>${esc(l)}</button>`;
    }).join("");
    const sub = k === "pos" && subOpen ? `<div class="subpop${subAnim?" anim":""}" role="menu"><div class="subpop-h">${POS_SUB[subOpen].label}種類（可複選）</div><div class="subpop-g">
          <button class="fopt" data-k="pos" data-v="${subOpen}" aria-pressed="${draft.pos.includes(subOpen)}">全部${POS_SUB[subOpen].label}<small>${bankList({...draft,pos:[subOpen]}, bankQuery).length}</small></button>
          ${POS_SUB[subOpen].subs.filter(([s]) => groups[subOpen].has(s)).map(([s,l]) => `<button class="fopt" data-k="pos" data-v="${subOpen}:${s}" aria-pressed="${draft.pos.includes(subOpen+":"+s)}">${l}<small>${bankList({...draft,pos:[subOpen+":"+s]}, bankQuery).length}</small></button>`).join("")}
        </div></div>` : "";
    return `<div class="frow"><div class="flabel"><span>${label}</span>${sm || (hn ? `<small class="fhint">${hn}</small>` : "")}</div><div class="fopts">${btns}</div>${sub}</div>`;
  };
  const draw = () => {
    const n = bankList(draft, bankQuery).length;
    const oldBody = ov.querySelector(".bsheet-body"), keep = oldBody ? oldBody.scrollTop : 0;
    ov.innerHTML = `<div class="bsheet" role="dialog" aria-modal="true" aria-label="排序與篩選">
      <div class="bsheet-head"><h2>${FILTER_ICON}排序與篩選</h2><button class="bsheet-x" data-x aria-label="關閉">✕</button></div>
      <div class="bsheet-body">${rows.map(([k,label,opts]) => rowHTML(k,label,opts)).join("")}</div>
      <div class="bsheet-foot"><button class="btn" data-reset>重設</button><button class="btn primary" data-apply>顯示 ${n} ${g?"個文法":"個字"}</button></div>
    </div>`;
    if (oldBody){ ov.classList.add("ready"); ov.querySelector(".bsheet-body").scrollTop = keep; }
  };
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("click", e => {
    if (e.target === ov || e.target.closest("[data-x]")) return close();
    const gb = e.target.closest("[data-grp]");
    if (gb){ subOpen = subOpen === gb.dataset.grp ? null : gb.dataset.grp; subAnim = true; draw(); subAnim = false; return; }
    const o = e.target.closest("[data-k]");
    if (o){ const k = o.dataset.k, v = o.dataset.v;
      if (k === "pos"){
        if (v === "all"){ draft.pos = []; subOpen = null; }
        else {
          const [vg, vs] = v.split(":"), has = draft.pos.includes(v);
          if (POS_SUB[vg]){
            if (vs === undefined) draft.pos = draft.pos.filter(x => !x.startsWith(vg + ":"));   // 全部動詞：拿掉細項
            else draft.pos = draft.pos.filter(x => x !== vg);                                  // 選細項：拿掉「全部」
          }
          draft.pos = has ? draft.pos.filter(x => x !== v) : [...draft.pos, v];
        }
      } else if (k === "type"){
        if (v === "all") draft.type = [];
        else if (draft.type.includes(v)) draft.type = draft.type.map(x => x === v ? "!" + v : x);
        else if (draft.type.includes("!" + v)) draft.type = draft.type.filter(x => x !== "!" + v);
        else draft.type = [...draft.type, v];
      } else if (k === "mfirst") draft.mfirst = draft.mfirst === v ? "none" : v;
      else if (TRI_KEYS.includes(k) && v !== "all") draft[k] = draft[k] === v ? "!" + v : draft[k] === "!" + v ? "all" : v;
      else draft[k] = v;
      draw(); return; }
    if (e.target.closest("[data-reset]")){ Object.assign(draft, BANK_DEFAULT, {pos:[], type:[]}); draw(); return; }
    if (e.target.closest("[data-apply]")){
      bankCfg = {...draft, pos:[...draft.pos], type:[...draft.type]}; try { localStorage.setItem("n1drill-bankcfg", JSON.stringify(bankCfg)); } catch(err){}
      close(); renderBank(main); return;
    }
    if (subOpen && !e.target.closest(".subpop")){ subOpen = null; draw(); return; }
  });
  document.addEventListener("keydown", onKey);
  draw(); document.body.appendChild(ov);
  ov.querySelector("[data-apply]").focus();

const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const localDb = (() => {
  const C = {words: {embed: EMBED_WORDS, key: "n1drill-mywords"}, grammar: {embed: EMBED_GRAMMAR, key: "n1drill-mygrammar"}};
  const subs = {words: [], grammar: []};
  const mine = c => lsGet(C[c].key) || [];
  const deleted = () => lsGet("n1drill-deleted") || [];
  const snap = c => { const del = deleted(); return {docs: [...C[c].embed, ...mine(c)].filter(w => !del.includes(w.id)).map(w => ({id:w.id, data:() => w}))}; };
  const emit = c => (c ? [c] : Object.keys(C)).forEach(k => subs[k].forEach(cb => cb(snap(k))));
  return {
    refresh: () => emit(),
    collection(name){ return {
      onSnapshot(cb){
        if (C[name]){ subs[name].push(cb); cb(snap(name)); }
        else if (name === "roots") cb({docs: Object.values(EMBED_ROOTS).map(r => ({id:r.key, data:() => r}))});
        else cb({docs: []});
        return () => {};
      },
      async add(obj){ if (!C[name]) return {id:""}; const id = "my-" + Date.now().toString(36); lsSet(C[name].key, [...mine(name), {...obj, id}]); emit(name); cloudSchedule(); return {id}; }
    }; },
    doc(path){ const [c, id] = path.split("/"); return {
      async get(){ return {exists:false, data:() => ({})}; },
      async set(){ cloudSchedule(); },
      async delete(){
        if (!C[c]) return;
        const m = mine(c);
        if (m.some(w => w.id === id)) lsSet(C[c].key, m.filter(w => w.id !== id));
        else lsSet("n1drill-deleted", [...deleted(), id]);
        emit(c); cloudSchedule();
      }
    }; }

})();

function mergeBy(a, b, pick){ const o = {...(a || {})}; for (const k in (b || {})) o[k] = k in o ? pick(o[k], b[k]) : b[k]; return o; }
const newer = (x, y) => ((y && y.t) || 0) > ((x && x.t) || 0) ? y : x;

    stats: mergeBy(L.stats, R.stats, newer),
    rstats: mergeBy(L.rstats, R.rstats, newer),
    seen: mergeBy(L.seen, R.seen, (x, y) => Math.max(x || 0, y || 0)),
    stars: mergeStars(L.stars || {}, R.stars),
    mywords: [...new Map([...(R.mywords || []), ...(L.mywords || [])].map(w => [w.id, w])).values()],
    mygrammar: [...new Map([...(R.mygrammar || []), ...(L.mygrammar || [])].map(w => [w.id, w])).values()],
    deleted: [...new Set([...(L.deleted || []), ...(R.deleted || [])])],
  };
}

  learn = S.learn; stats = S.stats; rstats = S.rstats; seen = S.seen; stars = S.stars || {};
