<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本語単語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column; a tab rail on top, the sentence card as the stage, word bank below as a ledger. */
:root{
  /* 純黑背景（深色單一主題）：卡片用極深灰浮在黑底上，文字用暖白，強調色調亮以免在黑底上發暗 */
  --bg:#000000; --surface:#111113; --ink:#ecebe7; --muted:#8d8d93; --line:#26262b;
  --ai:#9ab7ec; --ai-soft:#151f33; --ok:#7fd3a0; --ok-soft:#0f2419; --ng:#ff8e78; --ng-soft:#2b130e; --hint:#e8c46e; --hint-soft:#29200d;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans TC","Microsoft JhengHei","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ai);border-bottom-color:var(--ai);font-weight:700}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ng-soft);color:var(--ng);font-size:11px;margin-left:4px;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;gap:8px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.ng{background:var(--ng)} .dots i.cur{background:var(--ai)}
.pos{display:inline-block;font-size:12px;color:var(--ai);background:var(--ai-soft);padding:1px 8px;border-radius:4px}
.sentence{font-family:var(--f-display);font-size:24px;line-height:2.2;font-weight:500;word-break:break-word}
.sentence rt{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.blank-in{font:inherit;font-family:var(--f-body);font-size:21px;border:0;border-bottom:2px solid var(--ai);background:var(--ai-soft);color:var(--ink);padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;text-align:center;max-width:100%}
.blank-in.shake{animation:shake .3s}
.blank-box{display:inline-block;min-width:3em;border-bottom:2px solid var(--ai);margin:0 3px;text-align:center;color:var(--ai)}
.filled{color:var(--ai);font-weight:700}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.blank-in.shake{animation:none}}
.tr{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:700}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.msg{padding:10px 14px;border-radius:8px;font-size:14px}
.msg.ng{background:var(--ng-soft);color:var(--ng)}
.msg.hint{background:var(--hint-soft);color:var(--hint)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.detail{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:4px}
.detail .w{font-family:var(--f-display);font-size:22px;font-weight:700}
.detail .k{color:var(--muted);margin-left:8px;font-size:15px;font-family:var(--f-body);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.choices{grid-template-columns:1fr}}
.choice{font-family:var(--f-display);font-size:19px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;text-align:center;letter-spacing:.06em;line-height:1.3}
.center{text-align:center}
.kana-in{font:inherit;font-size:22px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:min(320px,100%);margin:0 auto;display:block}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.cardopts{display:flex;gap:6px;justify-content:flex-end;margin-top:-4px}
.optchip{font:inherit;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.optchip:disabled{opacity:.35;cursor:default}
.optchip[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.big.furi{line-height:1.9}
.big ruby rt{font-size:.36em;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.pager span{color:var(--muted);font-size:14px;min-width:56px;text-align:center}
.pager .btn:disabled{opacity:.35}
#bankGrid{touch-action:pan-y}
.wgrid.slidel{animation:slidel .22s ease}.wgrid.slider{animation:slider .22s ease}
@keyframes slidel{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slider{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.summary li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.summary ul{list-style:none;margin:0;padding:0}
.summary .mark{width:20px;font-weight:700}
.summary .mark.ok{color:var(--ok)} .summary .mark.ng{color:var(--ng)}
.score{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.add .full{grid-column:1/-1}
@media (max-width:520px){form.add{grid-template-columns:1fr}}
form.add label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
form.add input,form.add select{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;perspective:900px}
@media (max-width:420px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wc{display:grid;cursor:pointer;min-width:0;border-radius:10px}
.wc .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .4s ease;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;min-height:110px;min-width:0;position:relative}
.wc .front{display:flex;align-items:center;justify-content:center;text-align:center}
.wc .back{transform:rotateY(180deg);display:flex;flex-direction:column;gap:3px;background:var(--surface);border-color:var(--ai)}
.wc.open .front{transform:rotateY(-180deg)}
.wc.open .back{transform:rotateY(0)}
.wc:hover .face{border-color:var(--ai)}
.wc:not(.open) .back,.wc.open .front{pointer-events:none}
.wc:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.wc .face{transition:none}}
.wc .fw{font-family:var(--f-display);font-size:22px;font-weight:700;word-break:break-word}
.wc .fw{line-height:1.8}
.wc .fw ruby rt{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0}
.wc .fwrap{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.wgrid.long .fwrap{align-items:flex-start}
.wc .falt{font-family:var(--f-display);font-size:13px;color:var(--muted);line-height:1.4;min-height:1.4em;word-break:break-word}
.wc .falt i{font-style:normal;opacity:.5;margin:0 2px}
.wc .falt b{font-weight:500;white-space:nowrap}
.wc .lvc{position:absolute;top:6px;right:8px;font-size:10px;color:var(--muted);letter-spacing:.04em}
.wc .bw{font-family:var(--f-display);font-size:17px;font-weight:700;padding-right:40px;word-break:break-word}
.wc .bk{color:var(--muted);font-size:13px;padding-right:40px}
.wc .bm{font-size:13px;line-height:1.45}
.wc .bs{margin-top:auto;padding-top:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wc .bs b.ok{color:var(--ok)} .wc .bs b.ng{color:var(--ng)}
.delbtn{font:inherit;font-size:11px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px}
.delbtn:hover{color:var(--ng)}
.switch{font:inherit;font-size:13px;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);cursor:pointer;padding:4px 0}
.switch .knob{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--ai)}
.switch[aria-checked="true"] .knob::after{transform:translateX(14px)}
.conjbtn{position:absolute;top:24px;right:6px;font:inherit;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--ai);background:none;color:var(--ai);cursor:pointer}
.conjbtn:hover{background:var(--ai-soft)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--ink) 40%, transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px 18px 22px;width:min(480px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.sheet .w2{font-family:var(--f-display);font-size:22px;font-weight:700}
.sheet h3{font-size:13px;color:var(--ai);margin:8px 0 0}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;width:100%;font-size:14px}
.ctab th{text-align:left;font-weight:500;color:var(--muted);padding:6px 10px 6px 0;white-space:nowrap;font-size:12px}
.ctab td{padding:6px 10px 6px 0;border-top:1px solid var(--line)}
.ctab th{border-top:1px solid var(--line)}
.ctab .cw{font-family:var(--f-display);font-size:17px;font-weight:700}
.ctab .ck{color:var(--muted);font-size:13px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:4px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ai);cursor:pointer;vertical-align:middle;padding:0}
.spk:hover{border-color:var(--ai);background:var(--ai-soft)}
.wc .spk{width:24px;height:24px}
.sayline{display:flex;align-items:center;gap:6px}
.sayline .spk{margin-left:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:4px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface);font-weight:700}
.conn{font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.conn span{font-size:11px;color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:0 5px}
.note{font-size:13px;color:var(--hint);background:var(--hint-soft);padding:6px 10px;border-radius:6px}
.bconn{font-size:12px;color:var(--ink)}
.wgrid.long{grid-template-columns:1fr}
.wgrid.long .face{min-height:60px;padding:10px 44px 10px 16px}
.wgrid.long .front{justify-content:flex-start;text-align:left}
.wgrid.long .fw{font-size:20px}
.wgrid.long .back{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 16px}
.wgrid.long .bw{padding-right:0;font-size:18px}
.wgrid.long .bk{padding-right:0}
.wgrid.long .bm{flex:1 1 180px;font-size:14px}
.wgrid.long .bs{margin-top:0;padding-top:0}
@media (max-width:420px){.wgrid.long{grid-template-columns:1fr}}
.dirbtn{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:2px 10px;cursor:pointer}
.dirbtn:hover{border-color:var(--ai)}
.mbar{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--line);margin-left:6px;vertical-align:middle;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.listenbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
.bigspk{display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:13px;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai);border-radius:50%;width:110px;height:110px;justify-content:center;cursor:pointer}
.bigspk svg{width:38px;height:38px}
.bigspk:hover{filter:brightness(1.05)}
.slow{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
.lform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.lform{grid-template-columns:1fr}}
.lform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.lform input{font:inherit;font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.lform input.okf{border-color:var(--ok);background:var(--ok-soft)}
.lform input.ngf{border-color:var(--ng);background:var(--ng-soft)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.ptop{display:flex;gap:10px;align-items:center;justify-content:space-between}
.ptop .seg button{padding:7px 14px;font-size:14px}
.mpick{position:relative;flex:1;min-width:0;max-width:340px}
.mbtn{width:100%;display:flex;align-items:baseline;gap:10px;font:inherit;text-align:left;padding:10px 38px 10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}
.mbtn .ml,.mitem .ml{font-weight:700;font-size:16px;white-space:nowrap}
.mbtn .md{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mbtn .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);transition:transform .2s}
.mbtn[aria-expanded="true"]{border-color:var(--ai)}
.mbtn[aria-expanded="true"] .chev{transform:translateY(-50%) rotate(180deg)}
.mmenu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.35);
  opacity:0;transform:translateY(-8px) scaleY(.96);transform-origin:top;pointer-events:none;transition:opacity .16s,transform .18s}
.mmenu.open{opacity:1;transform:none;pointer-events:auto}
.mitem{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;width:100%;font:inherit;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.mitem .md{color:var(--muted);font-size:13px}
.mitem:hover:not(:disabled){background:var(--ai-soft)}
.mitem[aria-current="true"]{background:var(--ai-soft)}
.mitem[aria-current="true"] .ml,.mcheck{color:var(--ai)}
.mitem:disabled{opacity:.4;cursor:default}
.mbtn .badge,.mitem .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ng-soft);color:var(--ng);font-size:11px;margin-left:6px;text-align:center;font-weight:400}
.subtabs button{font:inherit;font-size:14px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:700}
.rgroup{display:flex;flex-direction:column}
.rgroup + .rgroup{margin-top:10px}
.rday{font-size:13px;font-weight:700;color:var(--ai);padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.rday small{color:var(--muted);font-weight:400}
.rrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.rrow .rw b{font-family:var(--f-display);font-size:17px}
.rrow .rw .k{color:var(--muted);font-size:13px;margin-left:6px}
.rrow .rm{font-size:14px;min-width:0}
.rrow .rs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow .rs b.ok{color:var(--ok)} .rrow .rs b.ng{color:var(--ng)}
@media (max-width:520px){.rrow{grid-template-columns:minmax(0,1fr) auto}.rrow .rm{grid-column:1/-1;grid-row:2}}
.sleep{position:fixed;inset:0;z-index:30;background:#0a0e15;color:#7f8ba0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.sleep-in{width:min(560px,100%);display:flex;flex-direction:column;gap:22px}
.sleep-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.sleep-now{text-align:center;display:flex;flex-direction:column;gap:6px;padding:20px 0}
.sleep .sw{font-family:var(--f-display);font-size:44px;font-weight:700;color:#c3cde0;word-break:break-word}
.sleep .sk{font-size:18px;color:#8e9bb3}
.sleep .sm{font-size:18px;color:#8e9bb3}
.sleep .sp{font-size:12px;color:#55627a;margin-top:8px;font-variant-numeric:tabular-nums}
.sleep-ctl{display:flex;justify-content:center;gap:14px;align-items:center}
.sbtn{font:inherit;font-size:20px;background:#151c28;color:#aab6cb;border:1px solid #263247;border-radius:999px;min-width:48px;height:48px;padding:0 16px;cursor:pointer}
.sbtn.main{font-size:16px;min-width:140px;background:#1e2b42;color:#d4ddec}
.sbtn.ghost{font-size:13px;height:32px;background:none}
.sleep-opt{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:13px}
.sleep-opt label{display:flex;gap:6px;align-items:center}
.sleep-opt select{font:inherit;background:#151c28;color:#aab6cb;border:1px solid #263247;border-radius:6px;padding:2px 6px}
.sleep-note{text-align:center;font-size:12px;color:#55627a}
.subtabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ng-soft);color:var(--ng);font-size:11px;margin-left:4px;text-align:center}
.rbad{font-size:11px;color:var(--ng);background:var(--ng-soft);border-radius:4px;padding:0 6px}
.scopeseg{align-self:flex-start}
.scopeseg button{font-size:15px;padding:6px 18px}
.rootsbox summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style:none;flex-wrap:wrap}
.rootsbox summary::-webkit-details-marker{display:none}
.rootsbox summary::before{content:"▸";color:var(--ai);font-size:13px;transition:transform .15s}

function verbType(w){
  const k = w.k || "", tail = k.slice(-1);
  if (/(^|[^぀-ゟ])?する$/.test(w.w) && k.endsWith("する")) return "suru";
  if (w.w === "来る" || w.w.endsWith("来る") && k.endsWith("くる")) return "kuru";
  if (tail === "る"){
    if (GODAN_RU.some(x => w.w.endsWith(x))) return "godan";
    const prev = k.slice(-2,-1);
    if (I_ROW.includes(prev) || E_ROW.includes(prev)) return "ichidan";

}

const synth = window.speechSynthesis || null;

function pickVoice(){

  jaVoice = all.filter(v => /^ja(-|_|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a))[0] || null;
  const ens = all.filter(v => /^en(-|_|$)/i.test(v.lang));
  const enScore = v => score(v) + (/^en[-_]us/i.test(v.lang)?3:0);

function scheduleSave(){

    const learnSnap = JSON.parse(JSON.stringify(learn)), rSnap = JSON.parse(JSON.stringify(rstats));

      localStorage.setItem("n1drill-learn", JSON.stringify(learnSnap)); localStorage.setItem("n1drill-rstats", JSON.stringify(rSnap)); } catch(e){}

// 看過的字（在單字庫或單字卡翻開過）：讀音測驗只考練過或看過的字

// 最近 7 天（今天往回算 7 天，含今天）有練習或翻開看過的字
// 學過＝在單字卡（學習）翻開過。練習、回顧、睡眠只用學過的字。

let learn = {};

const RECENT_DAYS = 7;

const isLearned = id => !!learn[id];

// ---------- 出題 ----------
function poolFor(m){
  if (m === "recapread") return recapWords();
  if (m === "rreview") return recapWords().filter(w => isWeakR(w.id));
  let ws = allWords();
  if (level === "ono") ws = ws.filter(isOno);
  else if (level !== "all") ws = ws.filter(w => lvIs(w, level));
  if (m === "card") return ws;
  if (!isVocab()){ if (m === "review") return ws.filter(w => isWeak(w.id)); return ws; }
  ws = ws.filter(w => isLearned(w.id));
  if (m === "review") return ws.filter(w => isWeak(w.id));
  if (practiceScope === "today") ws = ws.filter(w => learnedToday(w.id));
  if (m === "read") ws = ws.filter(w => hasKanji(w.w));
  return ws;
}
function startRound(m){
  const pool = poolFor(m);
  if (m === "review" || m === "rreview"){ round = {mode:m, ids:shuffle(pool).slice(0,ROUND).map(w=>w.id), i:0, res:[]}; }
  else if (m === "card"){
    // 先出還沒學過的字，再出最久沒看的字
    const fresh = shuffle(pool.filter(w => !isLearned(w.id)));
    const old = pool.filter(w => isLearned(w.id)).sort((a,b) => (learn[a.id].l||0) - (learn[b.id].l||0));
    round = {mode:m, ids:[...fresh, ...old].slice(0,ROUND).map(w=>w.id), i:0, res:[]};
  }
  else if (m === "recapread"){
    // 回顧複習：回顧錯題優先，其次最久沒複習的
    const rt = id => (rstats[id] && rstats[id].t) || 0;
    const sorted = pool.slice().sort((a,b) => (isWeakR(b.id) - isWeakR(a.id)) || (rt(a.id) - rt(b.id)));
    round = {mode:m, ids:shuffle(sorted.slice(0,20).map(w=>w.id)), i:0, res:[]};
  }
  else {
    const weak = shuffle(pool.filter(w=>isWeak(w.id)));
    const fresh = shuffle(pool.filter(w=>!stats[w.id]));
    const rest = shuffle(pool.filter(w=>stats[w.id] && !isWeak(w.id))).sort((a,b)=>(stats[a.id].t||0)-(stats[b.id].t||0));
    const pick = [...weak.slice(0,3), ...fresh, ...weak.slice(3), ...rest].slice(0,ROUND);
    round = {mode:m, ids:shuffle(pick.map(w=>w.id)), i:0, res:[]};

  if (mode === "card"){ markLearned(id); learn[id].r = ok ? 1 : 0; scheduleSave(); }
  else if (mode === "recapread" || mode === "rreview") recordR(id, ok);
  else record(id, ok);
}
function next(){
  round.i++;
  if (round.i >= round.ids.length){ q = null; } else newQ();
  render();
}

// 選擇題
function choicesFor(w){
  const p = parse(w);
  let ds = (w.d||[]).filter(Boolean);
  if (ds.length < 3){
    const others = shuffle(allWords().filter(o => o.id!==w.id && (o.pos||"")===(w.pos||"")).map(o=>parse(o).blank));
    const more = shuffle(allWords().filter(o => o.id!==w.id).map(o=>parse(o).blank));
    for (const x of [...others, ...more]) { if (ds.length>=3) break; if (x!==p.blank && !ds.includes(x)) ds.push(x); }
  }
  return shuffle([p.blank, ...ds.slice(0,3)]);
}

  const p = parse(w);

// ---------- 聽寫：聽發音，寫出單字和中文意思 ----------
let slowSpeech = false;
try { slowSpeech = localStorage.getItem("n1drill-slow") === "1"; } catch(e){}
let sampleFn = null;   // Claude 判斷意思（選用）
const stripParen = s => String(s||"").replace(/（[^）]*）|\([^)]*\)/g, "");
const cleanZh = s => String(s||"").normalize("NFKC").replace(/[\s。，、,.;；:：!！?？「」『』"'…〜~・\-—]/g, "");
function meaningCands(m){
  const base = stripParen(m);
  const parts = base.split(/[、，,；;／/]/).map(cleanZh).filter(Boolean);
  const whole = cleanZh(base);
  return [...new Set([...parts, whole].filter(Boolean))];
}
function lev(a, b){
  a = [...a]; b = [...b];
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for (let j=1;j<=b.length;j++) d[0][j] = j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
// 回傳 "ok"｜"close"（接近，算對）｜"maybe"（差一個字，請使用者確認）｜"ng"
function judgeMeaning(input, m){
  const us = String(input||"").split(/[、，,；;／/\s]/).map(cleanZh).filter(Boolean);
  if (!us.length) return "empty";
  const cs = meaningCands(m);
  let best = "ng";
  for (const u of us) for (const c of cs){
    if (u === c) return "ok";
    const ul = [...u].length, cl = [...c].length;
    if (ul >= 2 && c.includes(u)) return "ok";
    if (cl >= 2 && u.includes(c)) return "ok";
    if (ul === 1 && cl === 1 && u === c) return "ok";
    const dist = lev(u, c), mx = Math.max(ul, cl);
    if (mx === 2 && dist === 1 && best !== "close") best = "maybe";   // 兩個字差一個：讓使用者確認是不是選字打錯
    else if (mx >= 3 && dist <= Math.max(1, Math.floor(mx/3))) best = "close";
    const set = new Set([...c]); const common = [...u].filter(ch => set.has(ch)).length;
    if (mx >= 3 && (2*common)/(ul+cl) >= 0.67) best = "close";
  }
  return best;
}
function judgeWordHeard(w, input){
  const v = norm(input); if (!v) return "empty";
  return [w.w, w.k, ...(w.alt||[]), ...(w.forms||[])].map(norm).includes(v) ? "ok" : "ng";
}
function sayWord(w){ say(w.w, slowSpeech ? 0.65 : 0.9); }

        <button class="btn ghost" id="give">看答案</button></div>`}
  </div>`;
  $("#replay").onclick = () => sayWord(w);
  $("#slowT").onchange = e => { slowSpeech = e.target.checked; try { localStorage.setItem("n1drill-slow", slowSpeech?"1":"0"); } catch(err){} sayWord(w); };

  const ty = $("#typoYes"), tn = $("#typoNo");

const toHira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
// 把讀音對到每一段漢字上（送假名對齊）；對不起來就整個字標一個讀音
function furigana(text, kana){
  text = String(text); kana = toHira(String(kana||"").replace(/^〜/,""));
  if (!KANJI_RE.test(text) || !kana) return esc(text);
  const runs = []; for (const c of text){ const k = KANJI_RE.test(c); if (runs.length && runs[runs.length-1].k === k) runs[runs.length-1].t += c; else runs.push({k, t:c}); }
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const m = kana.match(new RegExp("^" + runs.map(r => r.k ? "(.+?)" : reEsc(toHira(r.t))).join("") + "$"));
  if (!m) return `<ruby>${esc(text)}<rt>${esc(kana)}</rt></ruby>`;

}

let zhVoice = null;
function pickZh(){
  if (!synth) return null;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /^zh[-_](TW|Hant)/i.test(v.lang)) || vs.find(v => /^zh[-_]HK/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null;
  return zhVoice;
}
function speakP(text, lang, rate, isOn){
  return new Promise(res => {
    if (!synth || !text || !isOn()) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate || 0.9;
    if (/^ja/.test(lang)){ if (!jaVoice) pickVoice(); if (jaVoice) u.voice = jaVoice; }
    else if (/^en/.test(lang)){ if (!enVoice) pickVoice(); if (enVoice) u.voice = enVoice; }
    else { if (!zhVoice) pickZh(); if (zhVoice) u.voice = zhVoice; }
    let done = false; const fin = () => { if (!done){ done = true; clearTimeout(tm); res(); } };
    const tm = setTimeout(fin, Math.max(5000, [...text].length * 450));
    u.onend = fin; u.onerror = fin;
    synth.speak(u);
  });
}
const waitP = (ms, isOn) => new Promise(res => { const t0 = Date.now(); const tick = () => (!isOn() || Date.now()-t0 >= ms) ? res() : setTimeout(tick, 200); tick(); });
function openSleep(words){
  const items = words.slice();
  if (!items.length) return;
  let order = sleepCfg.order === "rand" ? shuffle(items) : items.slice();
  let idx = 0, playing = false, token = 0, startedAt = 0, wake = null;
  const ov = document.createElement("div"); ov.className = "sleep";
  const save = () => { try { localStorage.setItem("n1drill-sleep", JSON.stringify(sleepCfg)); } catch(e){} };
  const lockWake = async () => { try { wake = await navigator.wakeLock?.request("screen"); } catch(e){ wake = null; } };
  const onVis = () => { if (document.visibilityState === "visible" && playing) lockWake(); };
  document.addEventListener("visibilitychange", onVis);
  const draw = () => {
    const w = order[idx % order.length];
    ov.innerHTML = `<div class="sleep-in">
      <div class="sleep-top"><span>睡眠播放・${items.length} 個${dom==="grammar"?"文法":"字"}</span><button class="sbtn ghost" data-act="close">關閉</button></div>
      <div class="sleep-now">
        <div class="sw">${esc(w.w)}</div>
        ${!isGrammar(w)&&norm(w.k)!==norm(w.w)?`<div class="sk">${esc(w.k)}</div>`:""}
        <div class="sm">${esc(w.m||"")}</div>
        <div class="sp">${(idx % order.length)+1} / ${order.length}</div>
      </div>
      <div class="sleep-ctl">
        <button class="sbtn" data-act="prev" aria-label="上一個">‹</button>
        <button class="sbtn main" data-act="toggle">${playing?"暫停":"開始播放"}</button>
        <button class="sbtn" data-act="next" aria-label="下一個">›</button>
      </div>
      <div class="sleep-opt">
        <label>間隔<select data-cfg="gap">${[[2,"短"],[4,"中"],[7,"長"]].map(([v,l])=>`<option value="${v}" ${sleepCfg.gap==v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label>順序<select data-cfg="order"><option value="seq" ${sleepCfg.order==="seq"?"selected":""}>依序</option><option value="rand" ${sleepCfg.order==="rand"?"selected":""}>隨機</option></select></label>
        <label>自動停止<select data-cfg="timer">${[[15,"15 分"],[30,"30 分"],[60,"60 分"],[0,"不停止"]].map(([v,l])=>`<option value="${v}" ${sleepCfg.timer==v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label><input type="checkbox" data-cfg="slow" ${sleepCfg.slow?"checked":""}>慢速</label>
        <label><input type="checkbox" data-cfg="twice" ${sleepCfg.twice?"checked":""}>單字唸兩次</label>
      </div>
      <div class="sleep-note">${playing?(sleepCfg.timer?`${sleepCfg.timer} 分鐘後自動停止。`:"會一直循環播放。"):"播放時請讓這個畫面保持開著；手機鎖螢幕後，有些瀏覽器會停止朗讀。"}</div>
    </div>`;
  };
  const stop = msg => { playing = false; token++; try { synth && synth.cancel(); } catch(e){} try { wake && wake.release(); } catch(e){} wake = null; draw(); if (msg) toast(msg); };
  const run = async (my) => {
    const isOn = () => playing && token === my;
    const firstLang = isEn() ? "en-US" : "ja-JP";
    while (isOn()){
      if (sleepCfg.timer && Date.now() - startedAt > sleepCfg.timer * 60000){ stop("已自動停止，晚安。"); return; }
      const w = order[idx % order.length]; draw();
      const rate = sleepCfg.slow ? 0.7 : 0.9;
      const word = w.w.replace(/^〜/,"");
      await speakP(word, firstLang, rate, isOn);
      if (sleepCfg.twice){ await waitP(900, isOn); await speakP(word, firstLang, rate, isOn); }
      await waitP(1000, isOn);
      await speakP(String(w.m||"").replace(/[；;／/]/g,"，"), "zh-TW", sleepCfg.slow ? 0.85 : 1, isOn);
      await waitP(sleepCfg.gap * 1000, isOn);

    }
  };
  const start = () => { if (!synth){ toast("這個瀏覽器不支援語音朗讀。"); return; } playing = true; token++; startedAt = Date.now(); lockWake(); draw(); run(token); };
  const close = () => { stop(); document.removeEventListener("visibilitychange", onVis); document.removeEventListener("keydown", onKey); ov.remove(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "close") return close();
    if (a === "toggle") return playing ? stop() : start();
    if (a === "next" || a === "prev"){
      idx = (idx + (a === "next" ? 1 : order.length - 1)) % order.length;
      if (playing){ token++; try { synth.cancel(); } catch(e){} run(token); } else draw();
    }
  });
  ov.addEventListener("change", e => {
    const el = e.target.closest("[data-cfg]"); if (!el) return;
    const k = el.dataset.cfg;
    sleepCfg[k] = el.type === "checkbox" ? el.checked : (k === "order" ? el.value : Number(el.value));
    if (k === "order"){ order = sleepCfg.order === "rand" ? shuffle(items) : items.slice(); idx = 0; }
    save();
  });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov); draw();
  ov.querySelector('[data-act="toggle"]').focus();
}

const POS_ORDER = ["名詞","する動詞","動詞","い形容詞","な形容詞","副詞","量詞","慣用語","其他"];
function posCat(w){
  if (isEn()) return w.pos || "其他";
  const p = w.pos || "";
  if (/擬/.test(p)) return /する/.test(p) ? "する動詞" : "副詞";
  if (/動/.test(p)) return "動詞";
  if (/慣用/.test(p)) return "慣用語";
  if (/量詞|助数/.test(p)) return "量詞";
  if (/する/.test(p)) return "する動詞";
  if (/イ形/.test(p)) return "い形容詞";
  if (/ナ形/.test(p)) return "な形容詞";
  if (/副/.test(p)) return "副詞";
  if (/^名/.test(p)) return "名詞";
  return "其他";
}

const statusIs = (w, s) => s === "learned" ? isLearned(w.id) : s === "new" ? !isLearned(w.id) : s === "weak" ? isWeak(w.id) : s === "rweak" ? isWeakR(w.id) : s === "mastered" ? isMastered(w.id) : true;
const isClassic = w => !!w.classic || /タル/.test(w.pos || "");
// 動詞、形容詞的細分類（單字庫篩選用）
const POS_SUB = {verb:{label:"動詞",subs:[["五段","五段動詞"],["一段","一段動詞"],["する","する動詞"],["名詞する","名詞＋する"],["カ變","カ行變格"]]},
                 adj:{label:"形容詞",subs:[["い","い形容詞"],["な","な形容詞"],["タル","タル形容詞"]]}};
function posSub(w){
  const c = posCat(w);

const BANK_DEFAULT = {sort:"seq", mfirst:"none", pos:[], type:[], kanji:"all", status:"all"};

}

  const posOpts = [...new Set(allWords().map(posCat))].sort((a,b) => { const i = POS_ORDER.indexOf(a), j = POS_ORDER.indexOf(b); return (i<0?99:i) - (j<0?99:j) || a.localeCompare(b); });
  const rows = [

    ...(!g && posOpts.length > 1 ? [["pos","詞性", isEn() ? [["all","全部"], ...posOpts.map(p=>[p,p])] : jaPosOpts]] : []),
    ...(vocab ? [["type","類型",[["all","全部"],["plain","一般"],["ono","擬聲擬態"],["loan","外來語"],["classic","古文"]]],
                 ["kanji","漢字",[["all","全部"],["yes","有漢字"],["no","無漢字"]]]] : []),

  ];
  const ov = document.createElement("div"); ov.className = "sheetov";
  let subAnim = false;

    return (neg ? "排除 " : "") + ((k === "pos" && posLabel(b)) || (opts.find(o => o[0] === b) || [,b])[1]); };
  const summary = (k, opts) => {
    if (MULTI_KEYS.includes(k)){ const a = draft[k]; if (!a.length) return "";
      return `<em>${a.map(v => `<span class="${v[0]==="!"?"negt":""}">${esc(optLabel(k, opts, v))}</span>`).join("、")}</em>`; }
    if (draft[k] === BANK_DEFAULT[k]) return "";
    return `<em class="${String(draft[k])[0]==="!"?"neg":""}">${esc(optLabel(k, opts, String(draft[k])))}</em>`;
  };
  const hint = k => k === "type" ? "可複選・點兩下＝排除" : k === "pos" ? "可複選" : TRI_KEYS.includes(k) ? "點兩下＝排除" : "";
  const grpCount = gk => draft.pos.filter(v => v === gk || v.startsWith(gk + ":")).length;
  const MF = [["weak","不熟的優先"],["strong","熟的優先"]];
  const sortRow = () => {
    const sm = [draft.sort === "rev" ? "倒序" : "", (MF.find(x => x[0] === draft.mfirst) || [,""])[1]].filter(Boolean).join("・");

  const onKey = e => { if (e.key === "Escape") close(); };

        }

  });
  document.addEventListener("keydown", onKey);
  draw(); document.body.appendChild(ov);
  ov.querySelector("[data-apply]").focus();
}

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const localDb = (() => {
  const subs = [];
  const mine = () => lsGet("n1drill-mywords") || [];
  const deleted = () => lsGet("n1drill-deleted") || [];
  const snap = () => { const del = deleted(); return {docs: [...EMBED_WORDS, ...mine()].filter(w => !del.includes(w.id)).map(w => ({id:w.id, data:() => w}))}; };

  return {
    collection(name){ return {
      onSnapshot(cb){
        if (name === "words"){ subs.push(cb); cb(snap()); }

      async add(obj){ const id = "my-" + Date.now().toString(36); lsSet("n1drill-mywords", [...mine(), {...obj, id}]); emit(); return {id}; }

        emit();

    }; }
